spring.application.name=gameplatform

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GamePlatformDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 上傳檔案大小限制(遊戲檔案、媒體檔案1008)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 自訂檔案儲存位置
app.upload.game-dir=uploads/games


# 遊戲封面儲存位置
app.upload.cover-dir=uploads/covers

# Gemini && 環境變數
gemini.api.key=${HERO_GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite


# JWT 設定
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=gameplatform
app.jwt.ttl-seconds=1800

# Spring Mail 設定 (以 Gmail 為例)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



# Google Cloud Console 申請的憑證 ID
google.client.id=${GOOGLE_CLIENT_ID:1054616689579-rgi8otjghbs1kaunji1ahhnkd00hag4g.apps.googleusercontent.com}


# 客服系統設定（整合風哥模組）
app.dialect=sqlserver
app.support.seed.enabled=false
app.support.staff-role-code=SUPPORT
app.support.admin-role-code=ADMIN



app.member.public-url=${APP_MEMBER_PUBLIC_URL:http://localhost:5173}

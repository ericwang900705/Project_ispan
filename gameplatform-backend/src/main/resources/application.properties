# SQL Server only. Local settings are loaded without environment variables.
spring.config.import=optional:file:./config/local.properties,optional:file:./gameplatform-backend/config/local.properties
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GamePlatformDB;encrypt=true;trustServerCertificate=false
spring.datasource.username=
spring.datasource.password=
spring.sql.init.mode=never
app.support.seed.enabled=false
spring.application.name=gameplatform
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.dialect=sqlserver

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=gameplatform
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

# 客服案件圖片：每張 5 MiB、每則 3 張，預留 multipart 邊界與文字空間。
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB


# Public publisher artwork. Keep this directory when upgrading or moving the server.
app.publisher-upload-dir=${PUBLISHER_UPLOAD_DIR:./uploads/publisher}

# Member/friend branch integration: verification and password-reset email
app.member.public-url=${HERO_PUBLIC_URL:http://localhost:5173}
app.member.mail.from=${APP_MEMBER_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMTP failure must not leave HTTP requests waiting indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

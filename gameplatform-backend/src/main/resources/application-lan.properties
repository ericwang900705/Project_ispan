# 同 Wi-Fi Nginx 部署：啟動時加 --spring.profiles.active=lan。
# 僅 Nginx 對外開放；Java 在同一台電腦內部使用 8080。
server.address=127.0.0.1
server.port=8080
app.lan-url=${HERO_LAN_URL:http://192.168.36.122}
app.frontend-url=${app.lan-url}
app.backend-url=${app.lan-url}
ecpay.frontend-url=${app.lan-url}
ecpay.backend-url=${app.lan-url}
app.member.public-url=${app.lan-url}
app.websocket.allowed-origins=${app.lan-url},http://localhost,http://127.0.0.1

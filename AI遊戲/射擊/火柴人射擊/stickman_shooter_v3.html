<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火柴人射擊 V3</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#e9f5ff;font-family:Arial,"Microsoft JhengHei",sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}#ui{position:fixed;top:12px;left:16px;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:bold;line-height:1.8}#help{position:fixed;bottom:12px;left:16px;color:#b8d2e7;font-size:13px;pointer-events:none}#panel{position:fixed;inset:0;background:#061024e8;display:flex;align-items:center;justify-content:center}#card{width:min(620px,94vw);padding:24px;border:1px solid #38d5ff;border-radius:18px;background:#101d35;box-shadow:0 0 45px #00baff33;text-align:center}h1{color:#69e9ff;margin:0 0 12px}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}button{background:#18395c;color:white;border:1px solid #5dcfff;padding:12px 17px;border-radius:10px;cursor:pointer;font-weight:bold}button:hover,.chosen{background:#168bb1}#start{background:#08a878;border-color:#6effc8;font-size:18px}small{color:#b4c5db}</style>
<canvas id="game"></canvas><div id="ui"></div><div id="help">A/D 移動｜W/空白 跳躍｜滑鼠瞄準、左鍵射擊｜R 換彈｜1/2/3 切換武器｜B 商店｜P 暫停</div>
<div id="panel"><div id="card"><h1 id="title">⚡ 火柴人射擊 V3</h1><div id="description">選擇角色與地圖，躲避敵方子彈，利用平台生存！</div><div id="choices" class="choices"></div><button id="start">開始遊戲</button><p><small id="hint">新增遠程射擊敵人、三張地圖與可跳上的平台；每 5 波有 Boss。</small></p></div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),ui=document.querySelector('#ui'),panel=document.querySelector('#panel'),title=document.querySelector('#title'),desc=document.querySelector('#description'),choices=document.querySelector('#choices'),start=document.querySelector('#start'),hint=document.querySelector('#hint');
let W,H,ground,platforms=[],enemyBullets=[],mapChoice=0,keys={},mouse={x:600,y:250,down:false},running=false,paused=false,shop=false,over=false,hero,bullets=[],enemies=[],particles=[],wave=0,spawnLeft=0,spawnClock=0,score=0,coins=0,selected=0,last=0;
const maps=[{name:'霓虹都市',sky:'#081124',floor:'#193750',grid:'#153352'},{name:'沙漠基地',sky:'#31251d',floor:'#74513b',grid:'#58402e'},{name:'冰封前線',sky:'#102b3e',floor:'#2a6176',grid:'#205069'}];
const chars=[{name:'疾風',color:'#65f4ff',hp:100,speed:310},{name:'鐵衛',color:'#ffc66a',hp:160,speed:240},{name:'幻影',color:'#d39aff',hp:85,speed:380}];
const guns=[{name:'手槍',damage:28,rate:.24,mag:12,reload:1.15,speed:850,spread:.025,shots:1,price:0},{name:'步槍',damage:16,rate:.095,mag:30,reload:1.55,speed:1000,spread:.07,shots:1,price:120},{name:'霰彈槍',damage:14,rate:.72,mag:6,reload:1.8,speed:760,spread:.38,shots:7,price:170}];
let owned=[true,false,false],ammo=[12,30,6],gun=0,shootCd=0,reloadCd=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;ground=H-75;platforms=[{x:W*.17,y:ground-135,w:Math.min(210,W*.23)},{x:W*.55,y:ground-210,w:Math.min(230,W*.26)},{x:W*.75,y:ground-95,w:Math.min(160,W*.18)}]}addEventListener('resize',resize);resize();
function reset(){hero={x:W*.23,y:ground,vy:0,onGround:true,hp:chars[selected].hp,max:chars[selected].hp,inv:0};bullets=[];enemies=[];enemyBullets=[];particles=[];wave=0;score=0;coins=0;owned=[true,false,false];ammo=[12,30,6];gun=0;shootCd=reloadCd=0;over=false;paused=false;shop=false;running=true;panel.style.display='none';nextWave()}
function nextWave(){wave++;spawnLeft=4+wave*2;spawnClock=.4;if(wave%5===0)spawnLeft+=1}
function makeEnemy(boss=false){let side=Math.random()<.5?-30:W+30;enemies.push({x:side,y:ground,hp:boss?480+wave*40:55+wave*8,max:boss?480+wave*40:55+wave*8,speed:boss?65:65+Math.min(wave*5,75),boss,hit:0,attack:0,fire:1+Math.random()*1.3,kind:boss?'boss':Math.random()<.42?'ranged':'melee'})}
function shoot(){if(reloadCd>0||shootCd>0)return;if(ammo[gun]<=0){reload();return}let g=guns[gun];ammo[gun]--;shootCd=g.rate;let angle=Math.atan2(mouse.y-(hero.y-38),mouse.x-hero.x);for(let i=0;i<g.shots;i++){let a=angle+(Math.random()-.5)*g.spread;bullets.push({x:hero.x,y:hero.y-38,vx:Math.cos(a)*g.speed,vy:Math.sin(a)*g.speed,life:1.4,damage:g.damage})}burst(hero.x+Math.cos(angle)*20,hero.y-38+Math.sin(angle)*20,'#ffe493',3)}
function reload(){if(reloadCd<=0&&ammo[gun]<guns[gun].mag)reloadCd=guns[gun].reload}
function burst(px,py,color,n){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*250,vy:(Math.random()-.5)*250,life:.2+Math.random()*.35,color})}
function openShop(){if(over)return;shop=true;paused=true;panel.style.display='flex';title.textContent='🛒 裝備商店';desc.textContent=`目前金幣：${coins}｜可購買武器或恢復生命`;choices.innerHTML='';guns.forEach((g,i)=>{let b=document.createElement('button');b.textContent=owned[i]?`${g.name}（已擁有）`:`${g.name} 💰${g.price}`;b.onclick=()=>{if(!owned[i]&&coins>=g.price){coins-=g.price;owned[i]=true;gun=i;reloadCd=0}else if(owned[i])gun=i;openShop()};choices.append(b)});let heal=document.createElement('button');heal.textContent='❤️ 恢復 50 生命｜💰60';heal.onclick=()=>{if(coins>=60&&hero.hp<hero.max){coins-=60;hero.hp=Math.min(hero.max,hero.hp+50)}openShop()};choices.append(heal);start.textContent='返回戰場';hint.textContent='按 B 也可關閉商店'}
function closeShop(){shop=false;paused=false;panel.style.display='none'}
function gameOver(){over=true;running=false;panel.style.display='flex';title.textContent='遊戲結束';desc.textContent=`撐到第 ${wave} 波｜分數 ${score}｜擊敗 ${Math.floor(score/10)} 名敵人（Boss 額外計分）`;choices.innerHTML='';start.textContent='再玩一次';hint.textContent='重新選擇角色後再挑戰'}
function drawStick(px,py,color,scale=1,aim=0){x.strokeStyle=color;x.lineWidth=4*scale;x.lineCap='round';x.beginPath();x.arc(px,py-57*scale,10*scale,0,Math.PI*2);x.moveTo(px,py-47*scale);x.lineTo(px,py-23*scale);x.lineTo(px-12*scale,py);x.moveTo(px,py-23*scale);x.lineTo(px+12*scale,py);x.moveTo(px,py-41*scale);x.lineTo(px+Math.cos(aim)*25*scale,py-41*scale+Math.sin(aim)*25*scale);x.moveTo(px,py-41*scale);x.lineTo(px-12*scale,py-27*scale);x.stroke()}
function update(dt){if(!running||paused)return;let sp=chars[selected].speed;hero.x+=((keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0))*sp*dt;hero.x=Math.max(20,Math.min(W-20,hero.x));if((keys.w||keys[' ']||keys.ArrowUp)&&hero.onGround){hero.vy=-590;hero.onGround=false}let prevY=hero.y;hero.vy+=1550*dt;hero.y+=hero.vy*dt;hero.onGround=false;if(hero.y>=ground){hero.y=ground;hero.vy=0;hero.onGround=true}for(let p of platforms){if(hero.vy>=0&&prevY<=p.y+5&&hero.y>=p.y&&hero.x>=p.x-8&&hero.x<=p.x+p.w+8){hero.y=p.y;hero.vy=0;hero.onGround=true}}hero.inv=Math.max(0,hero.inv-dt);shootCd=Math.max(0,shootCd-dt);if(reloadCd>0){reloadCd-=dt;if(reloadCd<=0){reloadCd=0;ammo[gun]=guns[gun].mag}}if(mouse.down)shoot();
if(spawnLeft>0){spawnClock-=dt;if(spawnClock<=0){let boss=wave%5===0&&spawnLeft===1;makeEnemy(boss);spawnLeft--;spawnClock=Math.max(.3,1.15-wave*.045)}}else if(enemies.length===0)nextWave();
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j],r=e.boss?37:22;if(Math.hypot(b.x-e.x,b.y-(e.y-37))<r){e.hp-=b.damage;e.hit=.1;burst(b.x,b.y,'#ff7373',5);hit=true;if(e.hp<=0){score+=e.boss?100:10;coins+=e.boss?100:15;burst(e.x,e.y-35,'#ffbf55',22);enemies.splice(j,1)}break}}if(hit||b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)bullets.splice(i,1)}
for(let e of enemies){let dir=Math.sign(hero.x-e.x);if(Math.abs(hero.x-e.x)>(e.kind==='ranged'?220:25))e.x+=dir*e.speed*dt;e.fire-=dt;if(e.kind!=='melee'&&e.fire<=0&&Math.abs(hero.x-e.x)<950){let a=Math.atan2(hero.y-38-(e.y-38),hero.x-e.x);let speed=e.boss?340:270;enemyBullets.push({x:e.x,y:e.y-38,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:3,damage:e.boss?17:9});e.fire=e.boss?.85:1.8+Math.random()*.7}e.hit=Math.max(0,e.hit-dt);e.attack-=dt;if(Math.abs(hero.x-e.x)<34&&(Math.abs(hero.y-e.y)<70)&&e.attack<=0){e.attack=.75;if(hero.inv<=0){hero.hp-=e.boss?28:12;hero.inv=.6;burst(hero.x,hero.y-35,'#ff6060',12);if(hero.hp<=0){gameOver();return}}}}
for(let i=enemyBullets.length-1;i>=0;i--){let b=enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.hypot(b.x-hero.x,b.y-(hero.y-38))<17&&hero.inv<=0){hero.hp-=b.damage;hero.inv=.5;burst(hero.x,hero.y-38,'#ff6060',10);enemyBullets.splice(i,1);if(hero.hp<=0){gameOver();return};continue}if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)enemyBullets.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
}
function draw(){x.fillStyle=maps[mapChoice].sky;x.fillRect(0,0,W,H);x.strokeStyle=maps[mapChoice].grid;x.lineWidth=1;for(let i=0;i<W;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,ground);x.stroke()}for(let j=0;j<ground;j+=60){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}x.fillStyle=maps[mapChoice].floor;x.fillRect(0,ground,W,H-ground);for(let p of platforms){x.fillStyle=maps[mapChoice].floor;x.fillRect(p.x,p.y,p.w,13);x.fillStyle='#4bd9e4';x.fillRect(p.x,p.y,p.w,3)}x.fillStyle='#31b5c7';x.fillRect(0,ground,W,3);
for(let e of enemies){let col=e.hit?'#fff':e.boss?'#ff9e3c':e.kind==='ranged'?'#ae8cff':'#ff5e78';drawStick(e.x,e.y,col,e.boss?1.55:1,Math.atan2(hero.y-e.y,hero.x-e.x));x.fillStyle='#4b1925';x.fillRect(e.x-25,e.y-(e.boss?105:77),50,5);x.fillStyle='#fa637a';x.fillRect(e.x-25,e.y-(e.boss?105:77),50*Math.max(0,e.hp/e.max),5)}
if(hero){x.globalAlpha=hero.inv>0&&Math.floor(performance.now()/70)%2?0.35:1;drawStick(hero.x,hero.y,chars[selected].color,1,Math.atan2(mouse.y-(hero.y-38),mouse.x-hero.x));x.globalAlpha=1}
x.fillStyle='#ff718e';for(let b of enemyBullets){x.beginPath();x.arc(b.x,b.y,5,0,Math.PI*2);x.fill()}x.fillStyle='#fff4a3';for(let b of bullets){x.beginPath();x.arc(b.x,b.y,3.5,0,Math.PI*2);x.fill()}for(let p of particles){x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)}
x.strokeStyle='#9eefff';x.lineWidth=1.5;x.beginPath();x.arc(mouse.x,mouse.y,10,0,Math.PI*2);x.moveTo(mouse.x-16,mouse.y);x.lineTo(mouse.x-5,mouse.y);x.moveTo(mouse.x+5,mouse.y);x.lineTo(mouse.x+16,mouse.y);x.moveTo(mouse.x,mouse.y-16);x.lineTo(mouse.x,mouse.y-5);x.moveTo(mouse.x,mouse.y+5);x.lineTo(mouse.x,mouse.y+16);x.stroke();
if(hero)ui.innerHTML=`❤️ 生命 ${Math.max(0,Math.ceil(hero.hp))}/${hero.max}<br>🗺️ ${maps[mapChoice].name}　🌊 第 ${wave} 波 ${wave%5===0?'👑 BOSS 波！':''}<br>⭐ 分數 ${score}　💰 ${coins}<br>🔫 ${guns[gun].name} ${reloadCd>0?'換彈中…':ammo[gun]+'/'+guns[gun].mag}<br>${paused?'⏸ 暫停中':''}`;
}
function loop(t){let dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key.toLowerCase()==='r')reload();if(['1','2','3'].includes(e.key)){let n=+e.key-1;if(owned[n]){gun=n;reloadCd=0}}if(e.key.toLowerCase()==='b'&&running){shop?closeShop():openShop()}if(e.key.toLowerCase()==='p'&&running&&!shop)paused=!paused});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);addEventListener('blur',()=>mouse.down=false);
function choose(){choices.innerHTML='';let mapBtn=document.createElement('button');mapBtn.textContent='🗺️ 地圖：'+maps[mapChoice].name+'（點擊切換）';mapBtn.onclick=()=>{mapChoice=(mapChoice+1)%maps.length;choose()};choices.append(mapBtn);choices.append(document.createElement('br'));chars.forEach((ch,i)=>{let b=document.createElement('button');b.className=i===selected?'chosen':'';b.textContent=`${ch.name}｜生命 ${ch.hp}｜速度 ${ch.speed}`;b.onclick=()=>{selected=i;choose()};choices.append(b)})}choose();start.onclick=()=>{if(shop)closeShop();else reset()};
</script></html>

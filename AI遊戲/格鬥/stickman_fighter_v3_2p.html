<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火柴人格鬥 V3：雙人對決</title><style>*{box-sizing:border-box}body{margin:0;background:#080c1b;color:#eef5ff;font-family:system-ui,'Microsoft JhengHei',sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{width:min(100%,1100px);padding:16px}h1{margin:0 0 10px;text-align:center;letter-spacing:4px;color:#8ff9ff}canvas{display:block;width:100%;aspect-ratio:16/9;border:2px solid #385a85;border-radius:14px;background:#0c1430;box-shadow:0 0 35px #0b89ff40}.hint{text-align:center;color:#b9c8e4;margin:12px 0}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:1px solid #5079aa;background:#172b4c;color:white;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:bold;touch-action:none}button:active{background:#347db1}#restart{background:#28617a}#selection{position:fixed;inset:0;background:#070d20ed;z-index:10;display:grid;place-items:center;padding:18px}#selection.hidden{display:none}.panel{width:min(800px,100%);background:#101d39;border:1px solid #5079aa;border-radius:20px;padding:26px;text-align:center;box-shadow:0 20px 80px #0009}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.card{background:#1a2a4a;padding:20px 10px;border:2px solid #344b70;border-radius:15px;cursor:pointer;transition:.15s}.card:hover,.card.selected{border-color:#7af7ff;transform:translateY(-3px);background:#223c62}.avatar{font-size:52px;margin-bottom:8px}.card strong{display:block;font-size:21px}.card small{display:block;color:#b8cce5;margin-top:9px;line-height:1.6}.mode{padding:12px;border:1px solid #405a81;border-radius:10px}.mode label{cursor:pointer}#selection{overflow-y:auto}.panel{max-height:95vh;overflow-y:auto}#start{background:#1889a6;font-size:19px;padding:13px 45px}#choose{background:#55418d}@media(max-width:550px){.cards{grid-template-columns:1fr}.card{padding:9px}.avatar{font-size:25px}.panel{padding:12px}} </style></head><body><div class="wrap"><h1>⚡ 火柴人格鬥 V3：雙人對決 ⚡</h1><canvas id="game" width="960" height="540"></canvas><p class="hint">1P：A/D 移動、W 跳、J 拳、K 踢、L 防、U 必殺<br>2P：←/→ 移動、↑ 跳、數字鍵 1 拳、2 踢、3 防、0 必殺（鍵盤上排數字也可）｜R 重開</p><div class="controls"><button data-key="a">◀</button><button data-key="d">▶</button><button data-key="w">跳躍</button><button data-key="j">拳擊</button><button data-key="k">踢擊</button><button data-key="l">防禦</button><button data-key="u">氣功波</button><button id="restart">重新開始</button><button id="choose">選擇角色</button></div></div><div id="selection"><div class="panel"><h1>⚔️ 選擇你的角色</h1><p>不同角色擁有不同速度、攻擊力與生命值</p><div class="mode"><label><input type="radio" name="mode" value="ai" checked> 單人 VS AI</label>　<label><input type="radio" name="mode" value="pvp"> 雙人對戰 1P VS 2P</label></div><h3>1P 角色</h3><div class="cards" id="cards"></div><div id="p2area" style="display:none"><h3>2P 角色</h3><div class="cards" id="cards2"></div></div><button id="start">開始戰鬥</button></div></div><script>
const classes=[{name:'閃電',icon:'⚡',color:'#56efff',hp:90,speed:5.4,power:1,desc:'高速型｜移動迅速，靈活閃避'},{name:'烈焰',icon:'🔥',color:'#ff9956',hp:100,speed:4.1,power:1.3,desc:'力量型｜攻擊威力較強'},{name:'鋼鐵',icon:'🛡️',color:'#a9b5ff',hp:130,speed:3.2,power:.95,desc:'防禦型｜生命值較高'}];let selected=0,selected2=1,mode="ai",playing=false;const cards=document.querySelector('#cards');classes.forEach((v,i)=>{const el=document.createElement('div');el.className='card'+(i===0?' selected':'');el.innerHTML=`<div class="avatar">${v.icon}</div><strong style="color:${v.color}">${v.name}</strong><small>${v.desc}<br>生命 ${v.hp}｜速度 ${v.speed}｜傷害 ${Math.round(v.power*100)}%</small>`;el.onclick=()=>{selected=i;document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('selected',j===i))};cards.append(el);const el2=el.cloneNode(true);el2.classList.toggle('selected',i===selected2);el2.onclick=()=>{selected2=i;document.querySelectorAll('#cards2 .card').forEach((x,j)=>x.classList.toggle('selected',j===i))};document.querySelector('#cards2').append(el2)});document.querySelectorAll('input[name="mode"]').forEach(r=>r.onchange=()=>{mode=document.querySelector('input[name="mode"]:checked').value;document.querySelector('#p2area').style.display=mode==='pvp'?'block':'none'});document.querySelector('#start').onclick=()=>{playing=true;document.querySelector('#selection').classList.add('hidden');reset()};document.querySelector('#choose').onclick=()=>{playing=false;keys.clear();document.querySelector('#selection').classList.remove('hidden')};
const c=document.querySelector('#game'),ctx=c.getContext('2d'),keys=new Set(),floor=448;let p,e,particles=[],shots=[],over=false,winner='',shake=0,frame=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const rand=(a,b)=>a+Math.random()*(b-a);
function fighter(x,color,face,role){return{x,y:floor,role,maxHp:role.hp,power:role.power,speed:role.speed,vx:0,vy:0,hp:role.hp,en:30,face,color,attack:null,at:0,hit:false,guard:false,stun:0,cool:0};}
function reset(){p=fighter(225,classes[selected].color,1,classes[selected]);e=mode==='pvp'?fighter(735,classes[selected2].color,-1,classes[selected2]):fighter(735,'#ff6d9c',-1,{hp:110,power:1,speed:3.7});particles=[];shots=[];over=false;winner='';shake=0;frame=0;}
function burst(x,y,color,n=13){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-5,5),vy:rand(-6,2),life:rand(12,27),color});}
function strike(f,type){if(!playing||over||f.stun>0||f.attack||f.cool>0)return;if(type==='special'&&f.en<35)return;if(type==='special')f.en-=35;f.attack=type;f.at=type==='kick'?25:type==='special'?34:17;f.hit=false;f.cool=type==='kick'?17:10;}
function damage(target,amount,dir){const blocked=target.guard&&target.stun===0;target.hp=clamp(target.hp-(blocked?Math.ceil(amount*.22):amount),0,target.maxHp);target.vx=dir*(blocked?2:8);target.stun=blocked?5:15;shake=blocked?3:9;burst(target.x,target.y-80,blocked?'#b4faff':'#ffe17c',blocked?7:17);if(target.hp<=0){over=true;winner=target===e?'1P 獲勝！':mode==='pvp'?'2P 獲勝！':'電腦獲勝！';}}
function updateF(f,other,controller){if(f.cool>0)f.cool--;if(f.stun>0)f.stun--;let move=0,guard=false;if(!over&&playing){if(controller!=='ai'){const c=controller==='p1'?{left:'a',right:'d',jump:'w',punch:'j',kick:'k',guard:'l',special:'u'}:{left:'arrowleft',right:'arrowright',jump:'arrowup',punch:'1',kick:'2',guard:'3',special:'0'};move=(keys.has(c.right)?1:0)-(keys.has(c.left)?1:0);guard=keys.has(c.guard);if(keys.has(c.jump)&&f.y>=floor)f.vy=-14;if(keys.has(c.punch))strike(f,'punch');if(keys.has(c.kick))strike(f,'kick');if(keys.has(c.special))strike(f,'special');}else{let dist=other.x-f.x;guard=other.attack&&Math.abs(dist)<110&&Math.random()<.07?true:f.guard&&Math.random()<.88;move=Math.abs(dist)>78?Math.sign(dist):Math.abs(dist)<52?-Math.sign(dist):0;if(frame%32===0&&Math.abs(dist)<118)strike(f,Math.random()<.35?'kick':'punch');if(frame%180===0&&Math.abs(dist)>155)strike(f,'special');if(frame%135===0&&Math.random()<.28&&f.y>=floor)f.vy=-13;}}
if(f.stun>0)guard=false;f.guard=guard&&!f.attack&&f.stun===0;if(f.stun===0){if(!f.attack&&!f.guard)f.vx=move*f.speed;else f.vx*=.75;}f.x=clamp(f.x+f.vx,30,930);f.vy+=.7;f.y+=f.vy;if(f.y>floor){f.y=floor;f.vy=0;}if(!f.attack&&Math.abs(other.x-f.x)>12)f.face=Math.sign(other.x-f.x);f.en=clamp(f.en+.045,0,100);
if(f.attack){f.at--;const type=f.attack,range=type==='kick'?112:82,active=type==='kick'?f.at>=9&&f.at<=16:f.at>=5&&f.at<=11;if(type==='special'&&f.at===18){shots.push({x:f.x+f.face*30,y:f.y-85,vx:f.face*9,owner:f,life:105});burst(f.x+f.face*30,f.y-85,f.color,20);}if(type!=='special'&&active&&!f.hit&&Math.abs(other.x-f.x)<range&&Math.abs(other.y-f.y)<80&&Math.sign(other.x-f.x)===f.face){damage(other,(type==='kick'?16:9)*f.power,f.face);f.en=clamp(f.en+9,0,100);f.hit=true;}if(f.at<=0)f.attack=null;}}
function drawF(f){let x=f.x,y=f.y,face=f.face,run=Math.sin(frame*.28)*Math.min(Math.abs(f.vx)/4,1)*14;ctx.save();ctx.translate(x,y);ctx.scale(face,1);ctx.strokeStyle=f.color;ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor=f.color;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,-116,17,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-99);ctx.lineTo(0,-53);ctx.moveTo(0,-53);ctx.lineTo(-18+run,-5);ctx.moveTo(0,-53);ctx.lineTo(19-run,-5);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-91);ctx.lineTo(-23,-72);ctx.lineTo(-32,-51);if(f.guard){ctx.moveTo(0,-91);ctx.lineTo(22,-104);ctx.lineTo(32,-89);}else if(f.attack==='punch'){ctx.moveTo(0,-91);ctx.lineTo(33,-86);ctx.lineTo(67,-87);}else{ctx.moveTo(0,-91);ctx.lineTo(22,-69);ctx.lineTo(31,-51);}ctx.stroke();if(f.attack==='kick'){ctx.beginPath();ctx.moveTo(0,-53);ctx.lineTo(39,-56);ctx.lineTo(83,-70);ctx.stroke();}if(f.guard){ctx.strokeStyle='#ffffff88';ctx.lineWidth=3;ctx.beginPath();ctx.arc(18,-80,44,-1.2,1.1);ctx.stroke();}ctx.restore();}
function bar(x,y,w,value,color,label,flip=false){ctx.fillStyle='#1d2949';ctx.fillRect(x,y,w,20);ctx.fillStyle=color;let ww=w*value/100;ctx.fillRect(flip?x+w-ww:x,y,ww,20);ctx.strokeStyle='#d7e7ff';ctx.lineWidth=2;ctx.strokeRect(x,y,w,20);ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.fillText(label,x,y-10);}
function draw(){ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.78;if(shake<.5)shake=0;}let g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#101737');g.addColorStop(1,'#26365c');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);ctx.strokeStyle='#4a78a533';ctx.lineWidth=1;for(let x=0;x<960;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,540);ctx.stroke();}for(let y=0;y<540;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke();}ctx.fillStyle='#1b3151';ctx.fillRect(0,floor,960,92);ctx.fillStyle='#3bd6ff';ctx.fillRect(0,floor,960,3);ctx.fillStyle='#ffffff22';ctx.fillRect(0,floor+32,960,2);
for(const s of shots){ctx.shadowColor=s.owner.color;ctx.shadowBlur=30;ctx.fillStyle=s.owner.color;ctx.beginPath();ctx.arc(s.x,s.y,17,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}for(const t of particles){ctx.globalAlpha=clamp(t.life/25,0,1);ctx.fillStyle=t.color;ctx.fillRect(t.x,t.y,5,5);}ctx.globalAlpha=1;drawF(p);drawF(e);ctx.restore();bar(32,42,340,p.hp/p.maxHp*100,p.color,'玩家｜'+classes[selected].name);bar(588,42,340,e.hp/e.maxHp*100,'#ff628e',mode==='pvp'?'2P｜'+classes[selected2].name:'電腦 AI',true);bar(32,81,220,p.en,'#f3d45b','能量');ctx.fillStyle='#dce8ff';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('VS',480,63);if(over){ctx.fillStyle='#050a19bb';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff';ctx.font='bold 54px system-ui';ctx.fillText(winner,480,240);ctx.font='24px system-ui';ctx.fillText('按 R 或「重新開始」再戰一場',480,293);}ctx.textAlign='left';}
function tick(){frame++;if(!over){updateF(p,e,'p1');updateF(e,p,mode==='pvp'?'p2':'ai');for(const s of shots){s.x+=s.vx;s.life--;let t=s.owner===p?e:p;if(Math.abs(s.x-t.x)<31&&Math.abs(s.y-(t.y-85))<53){damage(t,19*s.owner.power,Math.sign(s.vx));s.life=0;}}shots=shots.filter(s=>s.life>0&&s.x>0&&s.x<960);}for(const t of particles){t.x+=t.vx;t.y+=t.vy;t.vy+=.25;t.life--;}particles=particles.filter(t=>t.life>0);draw();requestAnimationFrame(tick);}window.addEventListener('keydown',ev=>{let k=ev.key.toLowerCase();if(['a','d','w','j','k','l','u','r','arrowleft','arrowright','arrowup','1','2','3','0'].includes(k)){ev.preventDefault();keys.add(k);if(k==='r'&&playing&&!ev.repeat)reset();}});window.addEventListener('keyup',ev=>keys.delete(ev.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.querySelector('#restart').onclick=reset;document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.setPointerCapture(ev.pointerId);keys.add(k);});for(let evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys.delete(k));});reset();tick();
</script></body></html>

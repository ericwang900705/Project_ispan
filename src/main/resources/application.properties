# 應用程式名稱
spring.application.name=backend
# 後端伺服器監聽的 port
server.port=8080

# ===== 資料庫連線設定（SQL Server）=====
# 連線網址：本機 1433 port、資料庫 cart_db；encrypt=true 啟用加密，trustServerCertificate=true 信任自簽憑證
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cart_db;encrypt=true;trustServerCertificate=true
# 資料庫帳號
spring.datasource.username=sa
# 資料庫密碼
spring.datasource.password=P@ssw0rd
# SQL Server JDBC 驅動程式類別
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate 設定 =====
# update：啟動時依 @Entity 自動建立或更新資料表結構（不會刪除既有資料）
spring.jpa.hibernate.ddl-auto=update 
# 在主控台印出執行的 SQL 語句，方便除錯
spring.jpa.show-sql=true

# ===== 綠界金流（ECPay）設定 =====
# 綠界官方公開的測試特店帳號（不會真的扣款），正式上線要換成自己申請的特店資料
ecpay.merchant-id=3002607
ecpay.hash-key=pwFHCqoQZGmho4w6
ecpay.hash-iv=EkRm7iFT261dpevs
# 綠界測試環境的付款頁網址（正式環境是 https://payment.ecpay.com.tw/Cashier/AioCheckOut/V5）
ecpay.action-url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5

# 綠界付款完要導回的網址：後端（接收付款結果）和前端（顯示結果給使用者）
app.backend-url=http://localhost:8080
app.frontend-url=http://localhost:5173

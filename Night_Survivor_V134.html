function v33Attack(k,lv){
 const target=v32Nearest(p.x,p.y,540);if(!target)return;
 const power=(17+lv*10)*p.dmg;
 if(k==='gravity'){
  const r=(v33Owned('gravity1')?190:150)+lv*8;
  let affected=0;
  for(const e of mon){
   const d=Math.hypot(e.x-target.x,e.y-target.y);
   if(e.hp<=0||d>r||d<4)continue;
   const strength=Math.min(24,55/d);
   e.x+=(target.x-e.x)/d*strength;
   e.y+=(target.y-e.y)/d*strength;
   v32Hit(e,power*.65*(v33Owned('gravity2')?1.35:1),'#b5a1ff');
   if(++affected>=38)break;
  }
  v32.effects.push({x:target.x,y:target.y,r,life:.65,color:'#b6a3ff'});
 }else if(k==='spear'){
  const count=v33Owned('spear2')?3:1;
  const angle=Math.atan2(target.y-p.y,target.x-p.x);
  for(let i=0;i<count;i++){
   const a=angle+(i-(count-1)/2)*.23;
   bul.push({x:p.x,y:p.y,vx:Math.cos(a)*610,vy:Math.sin(a)*610,life:1.25,
    damage:power*1.4*(v33Owned('spear1')?1.25:1),pierce:5,hit:new Set(),kind:'spear',r:8,color:'#ffd69d'});
  }
 }else if(k==='spirit'){
  v32Area(p.x,p.y,(v33Owned('spirit1')?195:150)+lv*7,power*(v33Owned('spirit2')?1.35:1),'#cfb5ff');
 }else if(k==='starfall'){
  const count=2+Math.floor(lv/2)+(v33Owned('starfall1')?2:0);
  const targets=mon.filter(e=>e.hp>0).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,count);
  for(const e of targets)v32Area(e.x,e.y,46,power*(v33Owned('starfall2')?1.3:1),'#ffe5ac',8);
 }else if(k==='quake'){
  v32Area(p.x,p.y,(v33Owned('quake1')?185:145)+lv*8,power*(v33Owned('quake2')?1.35:1),'#d5a16e');
 }else if(k==='thorn'){

function v33BossPhase(b,dt){
 let state=v33.bossState.get(b.id);
 if(!state){state={phase:1,cd:5.2,summon:8};v33.bossState.set(b.id,state)}
 const frac=b.hp/b.max,phase=frac<=.28?3:frac<=.62?2:1;
 if(phase>state.phase){
  state.phase=phase;state.cd=.8;
  v32.effects.push({x:b.x,y:b.y,r:110,life:1.1,color:phase===3?'#ff586e':'#ffd080'});
  v12Message?.('⚠️ 首領進入第 '+phase+' 階段！');
 }
 state.cd-=dt;state.summon-=dt;
 if(state.cd<=0){
  const attackCount=phase===3?2:1;
  for(let i=0;i<attackCount;i++)v32BossSkill(b);
  state.cd=phase===1?5.6:phase===2?4.3:3.1;
 }
 if(state.summon<=0&&phase>=2){
  state.summon=phase===3?8:11;
  for(let i=0;i<(phase===3?3:2);i++)enemy(false,false);
 }
}

  }

 }else if(mapChoice===1){

   add({kind:'cone',x:b.x,y:b.y,r:phase===3?300:245,angle:angle+(i-(phase-1)/2)*.43,arc:Math.PI*.31,life:1.0+i*.18,damage:14+phase*4});

function v51Spawn(){

 const id=v51Save.selected,d=v51Defs[id],lv=v51Save.levels[id]||0;
 if(!d||lv<1||!v51Ready(id)||v51.units.length>=1)return;

function v51Strike(u,target,ultimate){
 const d=v51Defs[u.id],lv=u.lv;
 const damage=(ultimate?62:25)*(1+lv*.55)*Math.max(1,p.dmg*.45);
 const radius=u.id==='titan'?(ultimate?230:115):u.id==='fallen'?(ultimate?170:90):(ultimate?200:120);
 v44Track((ultimate?'融合終極技：':'融合召喚：')+d.stages[lv-1],()=>{
  if(u.id==='astral'){
   const targets=mon.filter(e=>e.hp>0&&D(e,target)<(ultimate?440:290)).slice(0,ultimate?12:3+lv);
   for(const e of targets)v32Hit(e,damage*(ultimate?.75:1),d.color);
   v32Area(target.x,target.y,radius,damage*.6,d.color);
  }else if(u.id==='fallen'){
   v32Area(target.x,target.y,radius,damage,d.color);
   if(ultimate&&lv>=3)v32Area(target.x,target.y,radius+65,damage*.55,'#ffefab');
  }else{
   v32Area(target.x,target.y,radius,damage*1.15,d.color);
   if(ultimate&&lv>=3)v35State.zones.push({x:target.x,y:target.y,r:radius*.72,life:3,dps:damage*.16,color:d.color});
  }
 });
 v51.fx.push({x:target.x,y:target.y,r:radius,life:ultimate?.85:.4,max:ultimate?.85:.4,color:d.color});

const v51Tick=tick;
tick=function(dt){
 v51Tick(dt);if(mode!=='play'||!p)return;
 const step=Math.min(.06,dt);v51.clock+=step;v51.spawnCd-=step;
 if(v51.spawnCd<=0){v51.spawnCd=4;v51Spawn()}
 for(const u of v51.units){
  u.life-=step;u.cd-=step;u.special-=step;
  const target=v32Nearest(u.x,u.y,470);
  if(!target){u.x+=(p.x-u.x)*Math.min(1,step*1.4);u.y+=(p.y-u.y)*Math.min(1,step*1.4);continue}
  const distance=Math.max(1,D(u,target)),range=u.id==='astral'?230:u.id==='titan'?115:95;
  if(distance>range){const speed=u.id==='titan'?120:u.id==='astral'?160:205;u.x+=(target.x-u.x)/distance*speed*step;u.y+=(target.y-u.y)/distance*speed*step}
  if(u.cd<=0&&distance<range+50){u.cd=u.id==='titan'?2.1:u.id==='astral'?1.2:.7;v51Strike(u,target,false)}
  if(u.special<=0&&distance<350){u.special=Math.max(3.2,8-u.lv*1.1);v51Strike(u,target,true)}
 }
 v51.units=v51.units.filter(u=>u.life>0).slice(-1);
 for(const a of v51.fx)a.life-=step;
 v51.fx=v51.fx.filter(a=>a.life>0).slice(-12);
};

   g.strokeStyle='#ffe2a3';g.beginPath();g.moveTo(24,18);g.lineTo(34,-35);g.stroke();
  }else if(u.id==='astral'){
   for(let i=0;i<6;i++){const a=t*1.4+i*Math.PI/3;g.beginPath();g.arc(Math.cos(a)*19,Math.sin(a)*19,5,0,Math.PI*2);g.fill()}

  g.restore();
 }

 g.restore();

 if(id==='swordqi'){

 }else if(id==='rifle'){

 }else if(id==='drone'){

 }else if(id==='railgun'){

   if(e.hp<=0)return false;

}

function v57Cast(s,lv){
 const [id,name,,cl,color]=s,target=v32Nearest(p.x,p.y,700);
 if(!target)return;
 const b=v57Buff(cl),isOwn=p.heroClass===cl;
 const relic=v35Has(v57Classes[cl].relic);
 const n=(19+lv*12)*Math.max(1,p.dmg)*b.damage*(isOwn?1.3:1)*(relic?1.25:1);
 const radius=(id==='holywave'||id==='aegisnova'||id==='steelspin'?140:95)*b.range+lv*8;
 v44Track('職業技能：'+name,()=>{
  if(['moonbeam','rainarrow','falconshot','hellslash'].includes(id)){
   const count=(id==='falconshot'?1:2+lv)+(b.extra?2:0)+(relic?1:0);
   const targets=[...mon].filter(e=>e.hp>0&&D(e,p)<700).sort((a,z)=>D(a,target)-D(z,target)).slice(0,count);
   for(const e of targets)v32Hit(e,n*(id==='falconshot'?2.4:1.1),color);
  }else{
   const cx=['steelspin','holywave','aegisnova','riposte'].includes(id)?p.x:target.x;
   const cy=['steelspin','holywave','aegisnova','riposte'].includes(id)?p.y:target.y;
   v32Area(cx,cy,radius,n,color,16);
   if(b.extra||relic)v32Area(cx+45,cy-30,radius*.65,n*.55,color,9);
   if(id==='holywave'&&isOwn)p.hp=Math.min(p.max,p.hp+3+lv*2+(relic?5:0));
   if(id==='aegisnova'&&isOwn)p.inv=Math.max(p.inv,.16);
  }
 });
 v57.fx.push({x:target.x,y:target.y,r:radius,color,life:.52});
}
function v57Ultimate(cl){
 const d=v57Classes[cl],target=v32Nearest(p.x,p.y,720);
 if(!d||!target)return;
 const b=v57Buff(cl),relic=v35Has(d.relic);
 const r=(cl===3?265:cl===1?220:190)*b.range;
 const dmg=(90+p.level*5)*Math.max(1,p.dmg)*b.damage*(relic?1.35:1);
 v44Track('職業終極技：'+d.ultimate,()=>{
  v32Area(target.x,target.y,r,dmg,d.color,28);
  if(b.second||relic)v32Area(target.x+40,target.y-25,r*.7,dmg*.65,d.color,18);
  if(cl===3)p.hp=Math.min(p.max,p.hp+Math.min(35,p.max*.12));
  if(cl===2&&b.core)v32Area(target.x-65,target.y+45,r*.7,dmg*.5,d.color,12);
  if(cl===4&&b.core)v32Area(target.x+70,target.y+55,r*.7,dmg*.5,d.color,12);
 });
 v57.fx.push({x:target.x,y:target.y,r,color:d.color,life:1.1,ultimate:true});
 if(typeof v37Toast==='function')v37Toast('🌟 '+d.ultimate);
}
const v57OldTick=tick;
tick=function(dt){
 v57OldTick(dt);
 if(mode!=='play'||!p)return;
 const step=Math.min(.06,dt);v57.clock+=step;
 for(const s of v57Skills){
  const lv=p.weapon[s[0]]||0;
  if(!lv)continue;
  v57.cd[s[0]]=(v57.cd[s[0]]??.45)-step;
  if(v57.cd[s[0]]<=0){
   const equipped=v35Has(v57Classes[s[3]].relic);
   v57.cd[s[0]]=Math.max(.5,(3.5-lv*.16)/(p.rate||1)*(equipped?.85:1));
   v57Cast(s,lv);
  }
 }
 if(v57Classes[p.heroClass]){
  v57.ultimate-=step;
  if(v57.ultimate<=0){
   const cl=p.heroClass;
   v57.ultimate=21*v57Buff(cl).haste;
   v57Ultimate(cl);
  }
 }
 for(const f of v57.fx)f.life-=step;
 v57.fx=v57.fx.filter(f=>f.life>0).slice(-40);
};
const v57OldDraw=draw;
draw=function(){
 v57OldDraw();
 if(mode!=='play'||!p)return;
 g.save();g.translate(w/2-p.x,h/2-p.y);
 for(const f of v57.fx){
  g.globalAlpha=Math.min(1,Math.max(0,f.life*(f.ultimate?1:2)));
  g.strokeStyle=f.color;g.lineWidth=f.ultimate?5:3;
  const progress=f.ultimate?1-f.life/1.1:1-f.life/.52;
  g.beginPath();g.arc(f.x,f.y,Math.max(5,f.r*(.2+progress*.8)),0,Math.PI*2);g.stroke();
  if(f.ultimate){g.beginPath();g.arc(f.x,f.y,Math.max(5,f.r*(.8-progress*.2)),0,Math.PI*2);g.stroke()}
 }
 g.restore();
};

// V59：真實打擊回饋：受擊震動、方向火花、殘影、斬擊弧、衝擊環、槍口閃光、電弧
const v59={sparks:[],rings:[],slashes:[],trails:[],arcs:[],shake:0,flash:0,clock:0,previous:new Map(),lastX:0,lastY:0,hitCount:0};
function v59Burst(x,y,color,amount=9,force=150){
 for(let i=0;i<amount;i++){
  const a=Math.random()*Math.PI*2,s=force*(.35+Math.random()*.9);
  v59.sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.2+Math.random()*.35,max:.55,color,size:1.5+Math.random()*3});
 }
 if(v59.sparks.length>420)v59.sparks.splice(0,v59.sparks.length-420);
}
function v59Ring(x,y,color,r=35){
 v59.rings.push({x,y,r:4,end:r,life:.35,max:.35,color});
 if(v59.rings.length>80)v59.rings.shift();
}
const v59OldDamage=damage;
damage=function(e,n){
 if(!e||e.hp<=0)return;
 const before=e.hp;
 v59OldDamage(e,n);
 if(e.hp===before)return;
 const dx=e.x-(p?.x||0),dy=e.y-(p?.y||0),angle=Math.atan2(dy,dx);
 const lethal=e.hp<=0,boss=e.type==='boss',heavy=n>=50;
 const color=boss?'#fbb7e2':heavy?'#fff1af':'#d5ecff';
 v59.hitCount++;
 v59.shake=Math.max(v59.shake,lethal?(boss?12:5):heavy?4:2);
 if(heavy||lethal)v59.flash=Math.max(v59.flash,boss&&lethal?.23:.07);
 v59Burst(e.x,e.y,color,lethal?18:heavy?12:5,lethal?235:135);
 if(heavy||lethal)v59Ring(e.x,e.y,color,lethal?80:48);
 v59.slashes.push({x:e.x,y:e.y,a:angle,r:e.r+18,life:.2,max:.2,color});
 if(v59.slashes.length>90)v59.slashes.shift();
};
const v59OldHit=v32Hit;
v32Hit=function(e,n,kind){
 if(!e||e.hp<=0)return v59OldHit(e,n,kind);
 const oldHp=e.hp;
 const result=v59OldHit(e,n,kind);
 if(e.hp<oldHp){
  const color=typeof kind==='string'&&kind.startsWith('#')?kind:'#b9f2ff';
  v59Burst(e.x,e.y,color,Math.min(13,4+Math.floor(n/20)),120);
  if(n>40)v59Ring(e.x,e.y,color,50);
 }
 return result;
};
const v59OldStart=start;
start=function(cl){
 v59OldStart(cl);
 v59.sparks=[];v59.rings=[];v59.slashes=[];v59.trails=[];v59.arcs=[];v59.previous.clear();
 v59.shake=0;v59.flash=0;v59.clock=0;v59.hitCount=0;
};
const v59OldTick=tick;
tick=function(dt){
 const hpBefore=p?.hp??0;
 v59OldTick(dt);
 if(mode!=='play'||!p)return;
 const step=Math.min(.05,dt);v59.clock+=step;
 if(p.hp<hpBefore){v59.shake=Math.max(v59.shake,10);v59.flash=Math.max(v59.flash,.18);v59Burst(p.x,p.y,'#ff8195',18,230)}
 v59.shake=Math.max(0,v59.shake-step*30);
 v59.flash=Math.max(0,v59.flash-step*1.6);
 for(const q of v59.sparks){q.x+=q.vx*step;q.y+=q.vy*step;q.vx*=.91;q.vy*=.91;q.life-=step}
 v59.sparks=v59.sparks.filter(q=>q.life>0);
 for(const q of v59.rings)q.life-=step;
 v59.rings=v59.rings.filter(q=>q.life>0);
 for(const q of v59.slashes)q.life-=step;
 v59.slashes=v59.slashes.filter(q=>q.life>0);
 for(const q of v59.trails)q.life-=step;
 v59.trails=v59.trails.filter(q=>q.life>0);
 for(const q of v59.arcs)q.life-=step;
 v59.arcs=v59.arcs.filter(q=>q.life>0);
 // 彈道殘影與速度線：由子彈實際速度生成，不是單純改色
 for(const b of bul){
  if(Math.random()<.75)v59.trails.push({x:b.x,y:b.y,vx:b.vx||0,vy:b.vy||0,life:.19,max:.19,kind:b.kind});
 }
 if(v59.trails.length>220)v59.trails.splice(0,v59.trails.length-220);
 // 雷電技能的分岔電弧
 if(typeof lightningFX!=='undefined'&&lightningFX.length&&Math.random()<.65){
  const a=lightningFX[Math.random()*lightningFX.length|0];
  if(a)v59.arcs.push({x:a.x,y:a.y,life:.15,max:.15});
 }
 if(v59.arcs.length>32)v59.arcs.splice(0,v59.arcs.length-32);
};
const v59OldDraw=draw;
draw=function(){
 v59OldDraw();
 if(mode!=='play'||!p)return;
 g.save();
 g.translate(w/2-p.x,h/2-p.y);
 g.lineCap='round';
 // 高速彈體後方的彗尾、箭矢尖端和槍械彈道線
 for(const t of v59.trails){
  const alpha=Math.max(0,t.life/t.max);
  g.globalAlpha=alpha*.8;g.lineWidth=t.kind==='blade'?5:2.2;
  g.strokeStyle=t.kind==='arrow'?'#ffe9b0':t.kind==='blade'?'#e8efff':'#a6d5ff';
  const len=t.kind==='arrow'?36:t.kind==='blade'?19:27;
  const d=Math.hypot(t.vx,t.vy)||1;
  g.beginPath();g.moveTo(t.x,t.y);g.lineTo(t.x-t.vx/d*len,t.y-t.vy/d*len);g.stroke();
 }
 // 火花為有方向的長短線段，會隨速度衰減
 for(const q of v59.sparks){
  g.globalAlpha=Math.max(0,q.life/q.max);
  g.strokeStyle=q.color;g.lineWidth=q.size;
  g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x-q.vx*.025,q.y-q.vy*.025);g.stroke();
 }
 // 受擊衝擊波由內向外擴散
 for(const q of v59.rings){
  const t=1-q.life/q.max;
  g.globalAlpha=(1-t)*.85;g.strokeStyle=q.color;g.lineWidth=4*(1-t)+.7;
  g.beginPath();g.arc(q.x,q.y,q.r+(q.end-q.r)*t,0,Math.PI*2);g.stroke();
 }
 // 弧形刀光不是換色圓圈
 for(const q of v59.slashes){
  const t=1-q.life/q.max;
  g.globalAlpha=(1-t)*.8;g.strokeStyle=q.color;g.lineWidth=5*(1-t)+1;
  g.beginPath();g.arc(q.x,q.y,q.r+t*13,q.a-1.25,q.a+.65);g.stroke();
  g.lineWidth=2;g.beginPath();g.arc(q.x,q.y,q.r+11+t*13,q.a-.9,q.a+.5);g.stroke();
 }
 // 雷電鋸齒分叉
 for(const q of v59.arcs){
  g.globalAlpha=Math.max(0,q.life/q.max);g.strokeStyle='#dff9ff';g.lineWidth=2.8;
  for(let j=0;j<3;j++){
   g.beginPath();g.moveTo(q.x+(j-1)*10,q.y-90);
   for(let i=1;i<=5;i++)g.lineTo(q.x+(j-1)*10+Math.sin(i*5+j*3+v59.clock*22)*15,q.y-90+i*18);
   g.stroke();
  }
 }
 g.restore();
 g.globalAlpha=1;
 // 用畫布 CSS 位移實作小幅螢幕震動，避免干擾遊戲座標判定
 const shake=v59.shake;
 c.style.transform=shake>0.1?`translate(${(Math.random()-.5)*shake*2}px,${(Math.random()-.5)*shake*2}px)`:'';
 if(v59.flash>0){
  g.fillStyle=`rgba(255,232,213,${Math.min(.15,v59.flash*.55)})`;
  g.fillRect(0,0,w,h);
 }
};

   const item=v35Find(id);
   if(item&&item.slot===slot&&v35Save.inventory.includes(id))valid[slot]=id;

function v61Stats(cl){
 const baseHp=[150,100,115,165,105,125,145][cl],baseSpeed=[190,205,235,180,225,242,205][cl];
 const baseDmg=[1,1.3,1,1,1.18,1.12,1.08][cl];
 const baseArmor=[2,0,0,4,0,1,2][cl];
 const eq=v35Save.equipped;
 const has=id=>Object.values(eq).includes(id);
 const hp=baseHp+perks.hp*15;
 let atk=baseDmg*(1+perks.damage*.08),speed=baseSpeed*(1+perks.speed*.05),armor=baseArmor;
 if(cl===1&&has('mageglove'))atk*=1.15;
 if(cl===4&&has('demonclaw'))atk*=1.12;
 if(cl===2&&has('rangerboots'))speed*=1.12;
 if(cl===5&&has('xiaboots'))speed*=1.1;
 if(cl===0&&has('huntersmail'))armor+=2;
 if(cl===3&&has('saintmail'))armor+=2;
 if(cl===6&&has('soldiervest'))armor+=2;
 return {hp,atk,speed,armor,rate:1};
}

 return `<div class="v61Stats">${rows.map(([label,k,format])=>{
 const diff=old?st[k]-old[k]:0;

}

function v62TotalStats(){
 const a={hp:0,attack:0,armor:0,speed:0,crit:0,cooldown:0,regen:0};

}
const v62OldStart=start;

function v63Poly(g,x,y,r,sides,rot=0){

 for(let i=0;i<sides;i++){
  const a=i*2*Math.PI/sides+rot;
  if(i===0)g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
  else g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
 }
 g.closePath();
}
function v63DrawEffect(e){

 const alpha=Math.max(0,1-t),r=e.r*(.55+.5*t);

 g.lineWidth=Math.max(1,4*(1-t));
 if(e.type==='cleave'){
  // 劍刃雙弧與碎裂方向線
  for(let k=0;k<2;k++){
   g.beginPath();g.arc(e.x,e.y,r*(1+k*.22),e.angle-1.65+k*.15,e.angle+.65+k*.1);g.stroke();
  }
  for(let i=0;i<5;i++){
   const a=e.angle-1.1+i*.38;
   g.beginPath();g.moveTo(e.x+Math.cos(a)*r*.65,e.y+Math.sin(a)*r*.65);
   g.lineTo(e.x+Math.cos(a)*r*1.28,e.y+Math.sin(a)*r*1.28);g.stroke();
  }
 }else if(e.type==='rune'){
  // 雙層旋轉六芒魔法陣
  g.save();g.translate(e.x,e.y);g.rotate(v63.clock*.8+e.seed);
  v63Poly(g,0,0,r,6);g.stroke();g.rotate(-v63.clock*1.6);
  v63Poly(g,0,0,r*.7,3);g.stroke();g.rotate(Math.PI);
  v63Poly(g,0,0,r*.7,3);g.stroke();
  g.beginPath();g.arc(0,0,r*.42,0,Math.PI*2);g.stroke();g.restore();
 }else if(e.type==='arrowstorm'){
  // 落箭具有箭頭與羽翼，而不是圓形光圈
  for(let i=0;i<8;i++){
   const a=i*2.399+e.seed,dist=r*Math.sqrt((i+1)/9);
   const x=e.x+Math.cos(a)*dist,y=e.y+Math.sin(a)*dist;
   g.beginPath();g.moveTo(x-5,y-32*(1-t));g.lineTo(x,y+12);g.lineTo(x+5,y-32*(1-t));g.stroke();
   g.beginPath();g.moveTo(x-7,y+3);g.lineTo(x,y+12);g.lineTo(x+7,y+3);g.stroke();
  }
 }else if(e.type==='sanctuary'){
  // 實體六角屏障＋四方聖光柱
  v63Poly(g,e.x,e.y,r,6,Math.PI/6);g.stroke();
  v63Poly(g,e.x,e.y,r*.84,6,Math.PI/6);g.stroke();
  for(let i=0;i<4;i++){
   const a=i*Math.PI/2+Math.PI/4,x=e.x+Math.cos(a)*r*.6,y=e.y+Math.sin(a)*r*.6;
   g.fillStyle=pal.sub;g.globalAlpha=alpha*.35;g.fillRect(x-7,y-45,14,90);
   g.globalAlpha=alpha*.9;g.beginPath();g.moveTo(x-9,y);g.lineTo(x+9,y);g.moveTo(x,y-10);g.lineTo(x,y+10);g.stroke();
  }
 }else if(e.type==='inferno'){
  // 暗焰有不規則尖刺，內層渦旋
  for(let i=0;i<14;i++){
   const a=i*Math.PI*2/14+v63.clock*.6;
   const x=e.x+Math.cos(a)*r*.48,y=e.y+Math.sin(a)*r*.48;
   const tip=r*(.85+Math.sin(i*2.9+e.seed)*.18);
   g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(e.x+Math.cos(a+.22)*r*.75,e.y+Math.sin(a+.22)*r*.75,
    e.x+Math.cos(a+.5)*tip,e.y+Math.sin(a+.5)*tip);g.stroke();
  }
  g.beginPath();g.arc(e.x,e.y,r*.35,0,Math.PI*2);g.stroke();
 }else if(e.type==='inkslash'||e.type==='inkring'||e.type==='inkfoot'){
  // 水墨留白：粗筆觸、飛白、墨滴
  g.lineCap='round';g.lineWidth=12*(1-t)+2;
  g.beginPath();g.arc(e.x,e.y,r,e.angle-1.5,e.angle+.65);g.stroke();
  g.lineWidth=3;g.strokeStyle='#fff8e5';
  g.beginPath();g.arc(e.x,e.y,r+7,e.angle-1.2,e.angle+.5);g.stroke();
  g.fillStyle='#243e42';
  for(let i=0;i<6;i++){
   const a=e.angle+i*1.8,dist=r*(.5+i*.12);
   g.beginPath();g.arc(e.x+Math.cos(a)*dist,e.y+Math.sin(a)*dist,3+i%3,0,Math.PI*2);g.fill();
  }
 }else if(e.type==='muzzle'){

  g.save();g.translate(e.x,e.y);g.rotate(e.angle);
  g.fillStyle='#fff6cf';g.beginPath();g.moveTo(0,-7);g.lineTo(r*.9,0);g.lineTo(0,7);g.closePath();g.fill();

  g.restore();
 }else if(e.type==='target'||e.type==='beam'||e.type==='techstep'){

   g.beginPath();g.moveTo(0,-r*.7);g.lineTo(0,-r*.48);g.stroke();
  }

   g.fillStyle=gradient;g.fillRect(e.x-r,e.y-r*.3,r*2,r*.6);
  }
 }
 g.globalAlpha=1;
}

const v64OldDamage=damage;
damage=function(e,n){
 if(!e||e.hp<=0)return;
 const before=e.hp;
 const result=v64OldDamage(e,n);
 if(e.hp<before&&p){
  const cl=Number.isInteger(p.heroClass)?p.heroClass:0;
  const heavy=n>=38||e.hp<=0,dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy)||1;

 }

(function(){

 if(v93.rings.length>110)v93.rings.splice(0,v93.rings.length-110);
}

function capSpecial(cl,b,route){
 if(!p)return;
 const color=C[cl],t=targetAt(p.x,p.y),base=(20+p.level*1.5)*Math.max(1,p.dmg);
 const phase=(b*4+route),power=base*(1+route*.16);

 if(cl===0){

   const a=i*Math.PI*2/count+v93.time*.23;

 }else if(cl===1){
  // Mage: star patterns / slowing ice / expanding void singularities.
  if(t){
   const count=5+route*2;
   for(let i=0;i<count;i++){
    const a=i*Math.PI*2/count+v93.time*.3;
    hitCircle(t.x+Math.cos(a)*(110+route*23),t.y+Math.sin(a)*(110+route*23),65+route*9,power*.65,b===1?'#9be8ff':color);
   }
   if(b===1)for(const e of mon)if(e.hp>0&&D(e,t)<300)e.v87Frost=Math.max(e.v87Frost||0,3.4+route);

 }else if(cl===2){

   if(b===1)v87Dots.push({e:enemies[i],life:2.4+route*.6,cd:.5,power:power*.16});

 }else if(cl===3){

   if(b===1){

    for(const e of es)hitOne(e,power*.85,'#8fe0ff');

   }
   if(b===2)for(let k=0;k<3+route;k++)hitCircle(t.x+(k-2)*75,t.y+(k%2?80:-80),155,power*1.2,'#9fdcff');
  }

 if(route===3&&t)hitCircle(t.x,t.y,145+cl*9,power*1.2,color);
 v93.shots.push({cl,b,route,x:px,y:py,t:1.3});

<script>

(function(){

const FORMS=[
 ['劍神降臨','鋼鐵戰神','斷罪審判'],
 ['星界共鳴','極寒女皇','虛空君王'],
 ['千箭神域','瘟疫獵神','暗影神射'],
 ['熾天使覺醒','神聖裁決','永恆聖域'],
 ['煉獄魔王','鮮血君主','深淵魔神'],

function cap(){
 if(!p||mode!=='play')return null;

 // Last acquired variant gets priority; first is a stable fallback.

 state.timer=0;state.clock=0;state.burst=0;state.ready=0;state.cl=-1;
 state.orbs.length=0;state.particles.length=0;state.hits=0;
}
function spark(x,y,color,count=8){
 for(let k=0;k<count;k++){
  const a=Math.PI*2*k/count+state.clock*.3,sp=35+Math.random()*110;
  state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.55+Math.random()*.55,color});

}
function boom(x,y,r,dmg,color){
 v32Area(x,y,r,dmg,color,Math.min(24,8+Math.floor(r/13)));
 spark(x,y,color,9);
}
function strike(target,dmg,color){
 if(target){v32Hit(target,dmg,color);spark(target.x,target.y,color,4)}
}

 state.cl=p.heroClass;state.b=Number(n.b)||0;state.route=Number(n.capRoute)||0;
 state.duration=12+state.route*2;

 if(cl===0){

 }else if(cl===1){
  if(!target)return;
  if(b===0){for(let i=0;i<4+route;i++){
   const a=i*2.399+t;boom(target.x+Math.cos(a)*105,target.y+Math.sin(a)*105,65,dmg*.8,color)}
  }else if(b===1){
   boom(target.x,target.y,145,dmg,'#9eeeff');
   for(const e of mon)if(e.hp>0&&D(e,target)<175)e.v87Frost=Math.max(e.v87Frost||0,2.5);
  }else{boom(target.x,target.y,190,dmg*1.35,'#a27bff')}
 }else if(cl===2){
  const targets=mon.filter(e=>e.hp>0).sort((a,z)=>D(a,p)-D(z,p)).slice(0,4+route*2);
  for(const e of targets){

 }else if(cl===3){
  if(b===0){p.inv=Math.max(p.inv,.48);boom(x,y,145,dmg*1.25,'#fff4ba')}
  else if(b===1&&target)boom(target.x,target.y,165,dmg*1.45,color);
  else{p.hp=Math.min(p.max,p.hp+Math.max(4,p.max*.02));boom(x,y,100,dmg*.65,'#c9ffcf')}
 }else if(cl===4){
  if(target){
   boom(target.x,target.y,105,dmg*1.15,b===1?'#ff638c':color);
   if(b===0||b===2)for(const e of mon)if(e.hp>0&&D(e,target)<125)
    v87Dots.push({e,life:2.3,cd:.5,power:dmg*.13});
  }
  if(b===1)p.hp=Math.min(p.max,p.hp+Math.max(3,p.max*.012));
 }else if(cl===5){
  if(b===0&&target){
   for(let i=0;i<4+route;i++)strike(target,dmg*.52,color);
  }else if(b===1){
   p.inv=Math.max(p.inv,.4);
   for(let i=0;i<4;i++){
    const a=t*3+i*Math.PI/2;boom(x+Math.cos(a)*110,y+Math.sin(a)*90,50,dmg*.65,color);
   }
  }else if(target){
   // Dragon: spiral wave sweeps from the player toward enemies.
   const a=Math.atan2(target.y-y,target.x-x);
   for(let i=1;i<=5;i++){
    const r=i*65,side=Math.sin(t*5+i*.8)*42;

 }else if(cl===6){
  if(!target)return;

 oldTick(dt);
 if(mode!=='play'||!p)return;

 if(!n){state.timer=0;return}

  state.timer=Math.max(0,state.timer-d);
  state.burst-=d;
  if(state.burst<=0){state.burst=.36;attack()}
 }
 for(const f of state.particles){f.x+=f.vx*d;f.y+=f.vy*d;f.life-=d}

};
const oldUltimate=v57Ultimate;
v57Ultimate=function(cl){

 if(p&&p.heroClass===cl)startForm();

};
const old55=v55Cast;
v55Cast=function(skill,lv){const r=old55(skill,lv);if(p&&p.heroClass>=5&&cap()&&state.timer<=0&&state.ready<=0)startForm();return r};
const old56=v56Cast;
v56Cast=function(skill,lv){const r=old56(skill,lv);if(p&&p.heroClass>=5&&cap()&&state.timer<=0&&state.ready<=0)startForm();return r};
// Original five: awakening also triggers automatically on the class ultimate.
// Martial artist/soldier: awakening starts when a class skill is used.
const oldStart=start;
start=function(cl){clean();return oldStart(cl)};
function wing(x,y,t,color){
 g.save();g.translate(x,y);g.strokeStyle=color;g.lineWidth=4;
 for(const dir of [-1,1])for(let k=0;k<5;k++){
  g.beginPath();g.moveTo(dir*12,-16+k*6);
  g.quadraticCurveTo(dir*(45+k*7),-65+k*9,dir*(95+k*8),-35+k*17+Math.sin(t*4+k)*8);
  g.stroke();
 }g.restore();
}
function dragon(x,y,t,color){
 g.save();g.strokeStyle=color;g.lineWidth=11;g.lineJoin='round';g.lineCap='round';
 g.beginPath();
 let hx=x,hy=y;
 for(let i=0;i<50;i++){
  const a=i*.19+t*2,r=28+i*3.4;

 }g.stroke();

 g.fillStyle='#234f49';g.beginPath();g.arc(hx+4,hy-4,3,0,Math.PI*2);g.fill();
 g.restore();
}
function mech(x,y,t,color,route){
 const s=1.3+route*.12;
 g.save();g.translate(x,y);g.scale(s,s);
 g.fillStyle='#263d51';g.strokeStyle=color;g.lineWidth=3;
 g.fillRect(-35,-48,70,74);g.strokeRect(-35,-48,70,74);
 for(const d of [-1,1]){
  g.fillStyle='#334d63';g.fillRect(d*38-(d<0?25:0),-43,25,60);
  g.strokeRect(d*38-(d<0?25:0),-43,25,60);

  g.strokeRect(d*9-(d<0?19:0),26,19,36);

 }
 g.fillStyle='#c1f6ff';g.fillRect(-22,-28,44,17);
 g.fillStyle='#ffbe72';g.fillRect(-51,-56+Math.sin(t*7)*3,13,6);
 g.fillRect(38,-56+Math.sin(t*7)*3,13,6);

const oldDraw=draw;
draw=function(){
 oldDraw();
 if(mode!=='play'||!p)return;
 const n=cap();if(!n)return;
 const cl=p.heroClass,color=COLORS[cl],t=state.clock;
 g.save();g.translate(w/2-p.x,h/2-p.y);
 for(const f of state.particles){
  g.globalAlpha=Math.min(1,f.life);g.fillStyle=f.color;

 }
 if(state.timer>0){

   g.strokeStyle=color;g.lineWidth=3;
   for(let i=0;i<8;i++){

   for(let i=0;i<7;i++){const a=t+i*Math.PI*2/7;

 }
 g.restore();
 // On-screen awakening status. This is a gameplay UI, not a fake screenshot.
 const boxW=230,boxH=52,xx=w-boxW-18,yy=22;

const prevTick=tick;

 const d=Math.min(.06,Math.max(0,dt||0));state.timer+=d;
 for(const f of v103Particles)f.life-=d;
 for(let i=v103Particles.length-1;i>=0;i--)if(v103Particles[i].life<=0)v103Particles.splice(i,1);
 for(const f of v102Visuals)f.life-=d;
 for(let i=v102Visuals.length-1;i>=0;i--)if(v102Visuals[i].life<=0)v102Visuals.splice(i,1);
 for(const f of state.fx)f.life-=d;
 state.fx=state.fx.filter(f=>f.life>0);
 for(const f of v101Bursts)f.life-=d;
 for(let i=v101Bursts.length-1;i>=0;i--)if(v101Bursts[i].life<=0)v101Bursts.splice(i,1);
 if(state.made.size){
  // V112: independent cooldowns per crafted weapon, rather than one shared pulse.
  // Higher tiers hit harder but charge more slowly; each timer survives other crafts.
  const target=v32Nearest(p.x,p.y,850);
  for(const id of state.made){
   const tier=TIER3.some(r=>r[2]===id)?3:TIER2.some(r=>r[2]===id)?2:1;
   const period=(tier===3?2.6:tier===2?1.85:1.25)/Math.max(.45,p.rate||1);
   state.attackPeriods.set(id,period);
   const left=Math.max(0,(state.attackTimers.get(id)||0)-d);
   state.attackTimers.set(id,left);
   if(left<=0&&target){
    const power=(11+p.level*1.1)*Math.max(1,p.dmg)*(1+tier*.32);
    craftAttack(id,target,power,state.crafts);
    // V120: broadcast the real attack event, not an inferred cooldown reset.
    if(typeof globalThis.v120AttackEvent==='function')globalThis.v120AttackEvent(id,'crafted',period);
    state.attackTimers.set(id,period);
   }
  }
 }

<script>
/* V115 — weapon bar integration checks and optional on-demand diagnostics.
   Never changes weapon inventories or combat logic. */
(()=>{
 'use strict';
 const styles=document.createElement('style');
 styles.textContent=`
 #v109Weapons .slot{cursor:help}
 #v109Weapons .slot:focus-visible{outline:2px solid #ffdf9b;outline-offset:3px}
 #v115Warning{display:none;position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:28;background:#421f25ee;color:#ffe4db;border:1px solid #ff8f8f;border-radius:9px;padding:7px 12px;font:12px Microsoft JhengHei,Arial;pointer-events:none}
 `;document.head.appendChild(styles);
 const warning=document.createElement('div');warning.id='v115Warning';warning.setAttribute('role','status');document.body.appendChild(warning);
 let last=0,lastWarning='';
 function audit(){
  if(typeof mode==='undefined'||mode!=='play'||typeof p==='undefined'||!p){warning.style.display='none';return}
  const basic=Object.entries(p.weapon||{}).filter(([,lv])=>Number(lv)>0).map(([id])=>id);
  const craft=typeof globalThis.v113ActiveCrafts==='function'?globalThis.v113ActiveCrafts():[];
  const cd=typeof globalThis.v112CraftCooldowns==='function'?globalThis.v112CraftCooldowns():[];
  const ids=[...basic,...craft.map(x=>x.id)];
  const problems=[];
  if(ids.length>5)problems.push('武器超過 5 格');
  if(new Set(ids).size!==ids.length)problems.push('重複武器欄位');
  if(craft.some(x=>!cd.some(t=>t.id===x.id)))problems.push('融合武器缺少 CD 資料');
  const msg=problems.join('／');
  if(msg!==lastWarning){lastWarning=msg;if(msg)console.warn('[Night Survivor V115] '+msg,{basic,craft,cd})}
  warning.style.display=msg?'block':'none';
  warning.textContent=msg?'⚠️ 裝備狀態異常：'+msg:'';
  const slots=document.querySelectorAll('#v109Weapons .slot');
  slots.forEach((slot,i)=>{
   const id=slot.dataset.w,crafted=craft.find(x=>x.id===id),cooldown=cd.find(x=>x.id===id);
   const weaponName=slot.querySelector('.name')?.textContent||'空欄位';
   const tier=Number(slot.dataset.tier||0);
   slot.title=id?`${weaponName}｜${['基礎武器','一階進化','二階覺醒','傳說融合','職業共鳴'][tier]||'武器'}｜${cooldown?'融合攻擊獨立冷卻':'自動攻擊冷卻跑條'}`:'空武器欄位：升級時可以選擇新武器';
  });
 }
 const oldDraw=draw;
 draw=function(){oldDraw();const now=performance.now();if(now-last>350){last=now;audit()}};
 const oldStart=start;start=function(cl){last=0;lastWarning='';warning.style.display='none';return oldStart(cl)};
 globalThis.v115Audit=()=>{audit();return {warning:lastWarning,build:typeof globalThis.v114BuildState==='function'?globalThis.v114BuildState():null,cooldowns:typeof globalThis.v112CraftCooldowns==='function'?globalThis.v112CraftCooldowns():[]}};
})();
</script>
<script>
/* V116 — inventory / combat cooldown consistency.
   No additional attack loop: all indicators read the authoritative V100 state. */
(()=>{
 'use strict';
 const css=document.createElement('style');
 css.textContent=`
 #v116Counter{position:fixed;z-index:26;left:50%;bottom:130px;transform:translateX(-50%);padding:4px 12px;border-radius:10px;border:1px solid #bd9c67a8;background:#0c1728ed;color:#e8d7ae;font:12px Microsoft JhengHei,Arial;pointer-events:none;text-align:center;white-space:nowrap}
 #v109Weapons .slot[data-craft="1"] .iconbox{border-color:#edc873;box-shadow:inset 0 0 0 2px #0a1020,0 0 13px #d9a95155}
 #v109Weapons .slot[data-craft="1"] .fill{background:linear-gradient(90deg,#eab16a,#fff0a9)}
 #v109Weapons .slot[data-craft="1"] .level{color:#ffe5a1}
 @media(max-width:650px){#v116Counter{bottom:100px;font-size:10px;padding:3px 8px}}
 `;document.head.appendChild(css);
 const counter=document.createElement('div');counter.id='v116Counter';document.body.appendChild(counter);
 let last=0,previous='';
 function inventory(){
  const basic=typeof p!=='undefined'&&p?Object.entries(p.weapon||{}).filter(([,lv])=>Number(lv)>0).map(([id,lv])=>({id,lv,craft:false})):[];
  const made=typeof globalThis.v116CraftInventory==='function'?globalThis.v116CraftInventory():[];
  return {basic,made,slots:[...basic,...made.map(x=>({...x,lv:6,craft:true}))]};
 }
 function refresh(){
  const visible=typeof mode!=='undefined'&&mode==='play'&&typeof p!=='undefined'&&!!p;
  counter.style.display=visible?'block':'none';if(!visible)return;
  const {basic,made,slots}=inventory();
  const occupied=slots.length;
  const sig=slots.map(x=>x.id).join('|');
  if(sig!==previous){previous=sig;}
  counter.textContent=`⚔️ 武器 ${occupied}/5　💎 飾品 ${Object.keys(typeof globalThis.v100Passives==='function'?globalThis.v100Passives():{}).length}/5`+(occupied<5?'　✦ 可取得新武器':'　✦ 武器欄已滿');
  const rows=document.querySelectorAll('#v109Weapons .slot');
  for(const row of rows){
   const id=row.dataset.w;
   const craft=made.find(x=>x.id===id);
   row.dataset.craft=craft?'1':'0';
   if(!craft)continue;
   // The same timer used by the crafted weapon's actual attack loop.
   const ratio=Math.max(0,Math.min(1,1-craft.remaining/craft.period));
   const ready=craft.remaining<=.045;
   row.classList.toggle('ready',ready);
   const shade=row.querySelector('.shade'),fill=row.querySelector('.fill'),sweep=row.querySelector('.sweep');
   if(shade)shade.style.height=((1-ratio)*100).toFixed(1)+'%';
   if(fill)fill.style.width=(ratio*100).toFixed(1)+'%';
   if(sweep)sweep.style.setProperty('--sweep',(ratio*360).toFixed(1)+'deg');
   row.title=`${craft.name}｜${['','一階進化','二階覺醒','傳說融合'][craft.tier]}｜獨立自動攻擊 CD`;
  }
  // Warn only if another legacy system bypasses the five-slot cap.
  if(occupied>5&&sig!==previous+'_warn'){
   console.warn('[V116] 裝備超過 5 格；請檢查舊版技能授予流程',slots);
   previous=sig+'_warn';
  }
 }
 const oldDraw=draw;
 draw=function(){oldDraw();const now=performance.now();if(now-last>90){last=now;refresh()}};
 const oldStart=start;
 start=function(cl){previous='';last=0;return oldStart(cl)};
 globalThis.v116Status=()=>({inventory:inventory(),cooldowns:typeof globalThis.v116CraftInventory==='function'?globalThis.v116CraftInventory():[]});
 refresh();
})();
</script>
<script>
/* V117 — single compact loadout indicator and runtime consistency probe.
   Uses current inventory, not historical crafted items. Never grants weapons. */
(()=>{
 'use strict';
 const css=document.createElement('style');
 css.textContent=`
 #v114BuildStatus,#v116Counter{display:none!important}
 #v117Loadout{position:fixed;z-index:27;left:50%;bottom:128px;transform:translateX(-50%);max-width:95vw;box-sizing:border-box;border:1px solid #bd9b65;background:#0c1628ef;border-radius:12px;padding:7px 13px;color:#f8e6c0;font:12px 'Microsoft JhengHei',Arial,sans-serif;white-space:nowrap;pointer-events:none;text-align:center;box-shadow:0 3px 15px #0009}
 #v117Loadout .craft{color:#ffdb8b}#v117Loadout .free{color:#9be6c1}#v117Loadout .warn{color:#ff9b9b}
 @media(max-width:650px){#v117Loadout{bottom:102px;font-size:10px;padding:5px 8px}}
 `;document.head.appendChild(css);
 const el=document.createElement('div');el.id='v117Loadout';el.setAttribute('role','status');document.body.appendChild(el);
 let last=0,prevSig='',lastIssue='';
 function snapshot(){
  if(typeof p==='undefined'||!p)return null;
  const base=Object.entries(p.weapon||{}).filter(([,lv])=>Number(lv)>0).map(([id,lv])=>({id,lv:Number(lv)}));
  const made=typeof globalThis.v116CraftInventory==='function'?globalThis.v116CraftInventory():[];
  const passives=typeof globalThis.v100Passives==='function'?globalThis.v100Passives():{};
  const craftStatus=typeof globalThis.v100CraftStatus==='function'?globalThis.v100CraftStatus():null;
  const all=[...base.map(x=>x.id),...made.map(x=>x.id)];
  const problems=[];
  if(all.length>5)problems.push('武器超出 5 格');
  if(Object.keys(passives).length>5)problems.push('飾品超出 5 格');
  if(new Set(all).size!==all.length)problems.push('重複武器');
  if(made.some(x=>!Number.isFinite(x.remaining)||!Number.isFinite(x.period)||x.period<=0))problems.push('融合 CD 異常');
  if(made.some(x=>x.remaining>x.period+.2))problems.push('融合 CD 超過週期');
  return {base,made,passives,all,free:Math.max(0,5-all.length),recipes:craftStatus?.eligible?.length||0,problems};
 }
 function update(){
  const playing=typeof mode!=='undefined'&&mode==='play';
  el.style.display=playing?'block':'none';if(!playing)return;
  const s=snapshot();if(!s)return;
  const signature=[s.all.join(','),Object.keys(s.passives).join(','),s.recipes,s.problems.join(',')].join('|');
  if(signature!==prevSig){
   prevSig=signature;
   el.innerHTML=`⚔️ 武器 ${s.all.length}/5　💎 飾品 ${Object.keys(s.passives).length}/5`+
    (s.free?`　<span class="free">＋${s.free} 空欄</span>`:'')+
    (s.recipes?`　<span class="craft">⚒️ 可合成 ${s.recipes} 種</span>`:'')+
    (s.problems.length?`　<span class="warn">⚠️ ${s.problems.join('、')}</span>`:'');
  }
  const issue=s.problems.join('、');
  if(issue!==lastIssue){lastIssue=issue;if(issue)console.warn('[Night Survivor V117] 裝備檢查：'+issue,s)}
 }
 const priorDraw=draw;
 draw=function(){priorDraw();const now=performance.now();if(now-last>180){last=now;update()}};
 const priorStart=start;
 start=function(cl){prevSig='';lastIssue='';last=0;return priorStart(cl)};
 // Read-only diagnostic callable in DevTools: v117Check().
 globalThis.v117Check=()=>{
  const s=snapshot();
  if(!s)return {playing:false,ok:false,message:'尚未開始戰鬥'};
  return {playing:typeof mode!=='undefined'&&mode==='play',ok:s.problems.length===0,weaponCount:s.all.length,passiveCount:Object.keys(s.passives).length,freeSlots:s.free,eligibleRecipes:s.recipes,craftedCooldowns:s.made.map(x=>({name:x.name,remaining:x.remaining,period:x.period})),issues:s.problems};
 };
 update();
})();
</script>

<script>
/* V118：鐵砧配方預覽與融合欄位即時提示；不覆寫合成或戰鬥函式。 */
(()=>{
'use strict';
const recipes={
 arcane:['bolt','ruby',1],blades:['blade','hourglass',1],stormbow:['arrow','boots',1],frost:['nova','heart',1],orbit:['orb','plate',1],inferno:['flame','moon',1],plague:['poison','leaf',1],thunder:['lightning','clover',1],sanctuary:['garlic','magnet',1],
 astral:['arcane','hourglass',2],swordgod:['blades','ruby',2],skyhunt:['stormbow','clover',2],absolutezero:['frost','magnet',2],cosmos:['orbit','heart',2],hellking:['inferno','plate',2],blackdeath:['plague','moon',2],stormgod:['thunder','ruby',2],holyworld:['sanctuary','leaf',2],
 omega:['astral','swordgod',3],glacial:['skyhunt','absolutezero',3],eternal:['cosmos','holyworld',3],abyss:['hellking','blackdeath',3],thundercosmos:['stormgod','astral',3]
};
const names={bolt:'奧術魔彈',blade:'旋轉飛刃',arrow:'追蹤箭',nova:'冰霜新星',orb:'守護星',flame:'火焰精靈',poison:'毒霧',lightning:'雷霆之怒',garlic:'聖潔結界',ruby:'狂戰紅寶石',hourglass:'時之沙漏',boots:'疾風長靴',heart:'生命護符',plate:'守護胸針',moon:'血月聖物',leaf:'生命之葉',clover:'幸運四葉草',magnet:'吸魂磁石',arcane:'星辰魔導砲',blades:'無盡飛刃',stormbow:'風暴連弩',frost:'永冬結晶',orbit:'天體守護環',inferno:'煉獄火種',plague:'永恆瘟疫',thunder:'雷霆天罰',sanctuary:'聖域之心',astral:'星界殲滅者',swordgod:'萬劍歸宗',skyhunt:'天穹神獵',absolutezero:'絕對零度',cosmos:'宇宙聖環',hellking:'煉獄龍王',blackdeath:'黑死之潮',stormgod:'風暴雷神',holyworld:'永恆神國'};
const style=document.createElement('style');style.textContent=`
#box.v100anvil .v118preview{margin-top:11px;padding:10px 12px;border-radius:9px;background:#091a2dcc;border:1px solid #6685a8;color:#c8e4ff;font:12px/1.7 Microsoft JhengHei,Arial}
#box.v100anvil .v118preview b{color:#ffdc9a}
#box.v100anvil .v100recipe:focus-visible{outline:3px solid #fff1af;outline-offset:2px}
#v109Weapons .slot.v118fired .iconbox{animation:v118fire .27s ease-out}
@keyframes v118fire{0%{filter:brightness(2.2);transform:scale(1.1)}100%{filter:brightness(1);transform:scale(1)}}
`;document.head.appendChild(style);
let lastMenu='',lastFired=new Map(),lastRun=0;
function inventory(){
 const base=Object.entries(p?.weapon||{}).filter(([,lv])=>lv>0).map(([id])=>id);
 const crafted=(typeof globalThis.v116CraftInventory==='function'?globalThis.v116CraftInventory():[]).map(x=>x.id);
 return {base,crafted,used:base.length+crafted.length};
}
function decorate(){
 if(typeof mode==='undefined'||mode!=='v100anvil'||!p)return;
 const box=document.querySelector('#box.v100anvil');if(!box)return;
 const buttons=[...box.querySelectorAll('.v100recipe[data-craft]')];
 const signature=buttons.map(b=>b.dataset.craft).join('|');
 if(signature===lastMenu&&buttons.every(b=>b.querySelector('.v118preview')))return;
 lastMenu=signature;
 const inv=inventory();
 for(const btn of buttons){
  const id=btn.dataset.craft,rec=recipes[id];if(!rec||btn.querySelector('.v118preview'))continue;
  const [a,b,tier]=rec;
  const removed=tier===3?2:1,after=inv.used-removed+1;
  const requirements=tier===3?`${names[a]||a} ＋ ${names[b]||b}`:`${names[a]||a} ＋ ${names[b]||b}（飾品保留）`;
  const preview=document.createElement('div');preview.className='v118preview';
  preview.innerHTML=`<b>材料：</b>${requirements}<br><b>武器欄位：</b>${inv.used}/5 → ${after}/5`+
   (tier===3?'　<span style="color:#a8ffd7">✓ 釋放 1 個欄位</span>':'　<span style="color:#b9d7ff">替換原有武器</span>')+
   '<br><b>攻擊：</b>合成後使用該武器獨立冷卻';
  btn.appendChild(preview);
 }

function refreshAttackFeedback(){

 const slots=[...panel.querySelectorAll('.slot[data-w]')];
 for(const slot of slots){
  const id=slot.dataset.w;if(!id)continue;
  const item=crafted.get(id),raw=item?item.remaining:Number(p.cool?.[id]);
  if(!Number.isFinite(raw))continue;
  const prev=lastFired.get(id);

  if(prev!==undefined&&prev<=.06&&raw>.12){
   slot.classList.remove('v118fired');void slot.offsetWidth;slot.classList.add('v118fired');
  }
  lastFired.set(id,raw);
 }
 for(const key of [...lastFired.keys()])if(!slots.some(s=>s.dataset.w===key))lastFired.delete(key);

const oldDraw=draw;

<script>
/* V124 — seven awakening weapons: real hits, class-specific combat, bounded effects. */
(()=>{
'use strict';

function strike(k){
 const near=candidates(590),target=near[0];if(!target)return;

 if(k===0){ // knight: orbiting blades slash six nearby enemies
  for(const e of near.slice(0,6)){hurt(e,power*.9);effect(e.x,e.y,'slash',36,.36,Math.atan2(e.y-p.y,e.x-p.x))}
  effect(origin.x,origin.y,'swords',90,.55)
 }else if(k===1){ // mage: delayed star sigils explode in sequence
  for(const e of near.slice(0,3)){effect(e.x,e.y,'rune',62,.66);area(e.x,e.y,57,power*.78,12)}
 }else if(k===2){ // ranger: aimed arrows with pierce and brief slow
  for(const e of near.slice(0,5)){hurt(e,power*.75);e.v124Slow=Math.max(e.v124Slow||0,.8);effect(e.x,e.y,'arrow',50,.38,Math.atan2(e.y-p.y,e.x-p.x))}
 }else if(k===3){ // guardian: heals and judges clustered enemies
  p.hp=Math.min(p.max,p.hp+Math.max(2,p.max*.013));area(origin.x,origin.y,180,power*.85,26);effect(origin.x,origin.y,'holy',180,.75)
 }else if(k===4){ // demon: fire pools with ticking damage
  effect(target.x,target.y,'fire',92,2.7);area(target.x,target.y,92,power*.8,20)
 }else if(k===5){ // martial artist: rapid dragon punches in a line
  const a=Math.atan2(target.y-p.y,target.x-p.x);for(let j=1;j<=5;j++){let x=origin.x+Math.cos(a)*j*67,y=origin.y+Math.sin(a)*j*67;area(x,y,48,power*.45,10);effect(x,y,'dragon',50,.45+j*.04,a)}

  for(const e of near.slice(0,3)){area(e.x,e.y,52,power*.65,12);effect(e.x,e.y,'shell',60,.45);effect(origin.x,origin.y,'muzzle',36,.2,Math.atan2(e.y-p.y,e.x-p.x))}
 }
 shots++;
}
function update(dt){

 const on=valid()&&s&&s.active&&s.cl===p.heroClass&&s.cl>=0&&s.cl<7;
 if(!on){active=false;cl=-1;clock=0;effects.length=0;return}
 if(!active||cl!==s.cl){active=true;cl=s.cl;clock=.15;shots=0;effects.length=0}
 clock-=dt;let loops=0;while(clock<=0&&loops++<2){strike(cl);clock+=cd[cl]/Math.max(.65,Math.min(2.5,p.rate||1))}
 for(const f of effects){f.life-=dt;if(f.kind==='fire'&&f.life>0){f.tick=(f.tick||0)-dt;if(f.tick<=0){f.tick=.45;area(f.x,f.y,f.r,8+Math.min(30,p.level*.65),14)}}}

 // Slow is implemented as a temporary adjustment to actual enemy movement speed.

  else if(f.kind==='swords'){for(let i=0;i<6;i++){let q=i*TAU/6+t*2;g.save();g.rotate(q);g.beginPath();g.moveTo(r*.5,-12);g.lineTo(r*.9,0);g.lineTo(r*.5,12);g.closePath();g.stroke();g.restore()}}
  else if(f.kind==='rune'){g.rotate(t);for(let j=0;j<2;j++){g.beginPath();g.arc(0,0,r*(.7+j*.24),0,TAU);g.stroke()}for(let j=0;j<6;j++){let q=j*TAU/6;g.beginPath();g.moveTo(Math.cos(q)*r*.55,Math.sin(q)*r*.55);g.lineTo(Math.cos(q)*r,Math.sin(q)*r);g.stroke()}}
  else if(f.kind==='arrow'){g.beginPath();g.moveTo(-r,0);g.lineTo(r,0);g.moveTo(r-14,-9);g.lineTo(r,0);g.lineTo(r-14,9);g.stroke()}
  else if(f.kind==='holy'){g.beginPath();g.arc(0,0,r*(.5+.5*t),0,TAU);g.stroke();for(let j=0;j<12;j++){let q=j*TAU/12;g.beginPath();g.moveTo(Math.cos(q)*r*.65,Math.sin(q)*r*.65);g.lineTo(Math.cos(q)*r*.9,Math.sin(q)*r*.9);g.stroke()}}
  else if(f.kind==='fire'){g.globalAlpha=a*.35;g.fillStyle='#ff623d';g.beginPath();g.ellipse(0,0,r,r*.55,0,0,TAU);g.fill();g.globalAlpha=a;for(let j=0;j<8;j++){let q=j*TAU/8+t*2;g.beginPath();g.moveTo(Math.cos(q)*r*.45,Math.sin(q)*r*.3);g.lineTo(Math.cos(q)*r*.7,Math.sin(q)*r*.5-18*Math.sin(t*7+j));g.stroke()}}
  else if(f.kind==='dragon'){g.beginPath();g.moveTo(-r,12);g.quadraticCurveTo(-r*.2,-r*.65,r*.65,-6);g.lineTo(r,-18);g.moveTo(r*.65,-6);g.lineTo(r,7);g.stroke()}
  else if(f.kind==='shell'){g.beginPath();g.arc(0,0,r*t,0,TAU);g.stroke();for(let j=0;j<7;j++){let q=j*TAU/7;g.beginPath();g.moveTo(Math.cos(q)*r*.3,Math.sin(q)*r*.3);g.lineTo(Math.cos(q)*r*.9,Math.sin(q)*r*.9);g.stroke()}}
  else if(f.kind==='muzzle'){g.beginPath();g.moveTo(10,0);g.lineTo(r,0);g.moveTo(r*.7,-9);g.lineTo(r,0);g.lineTo(r*.7,9);g.stroke()}
  g.restore();
 }
 g.restore();
}
const oldTick=tick;tick=function(dt){oldTick(dt);if(mode==='play')try{update(dt)}catch(err){if(performance.now()-lastState>4000){lastState=performance.now();console.warn('V124 awakening combat:',err)}}};
const oldDraw=draw;draw=function(){oldDraw();try{paint()}catch(err){if(performance.now()-lastState>4000){lastState=performance.now();console.warn('V124 awakening visuals:',err)}}};

<script>

(()=>{

  else if(m[2]==='dragon'||m[2]==='chi'){g.beginPath();for(let i=0;i<16;i++){const x=(i/15-.5)*r*2,y=Math.sin(i*.65+t*8)*r*.28;if(!i)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}

<script>
/* V128 — 七職業 21 種流派專屬戰鬥屬性；局外星盤配置套用到局內。 */
(()=>{

 const configs=[
  ['swordForce','block','bossDamage'],['astralRadius','frostDuration','voidPower'],
  ['arrowPower','toxin','execute'],['holyShield','judgement','healing'],
  ['burn','leech','demonPower'],['flyingSword','chiRadius','gadget'],
  ['ballistics','drone','electromagnetic']
 ];
 let pulse=0,applied=0,active=-1;
 const count=(k)=>Math.min(20,Math.max(0,Number(p?.v128Traits?.[k])||0));
 const area=(x,y,r,d,max=12)=>{let n=0;for(const e of mon){if(e.hp>0&&Math.hypot(e.x-x,e.y-y)<r+(e.r||0)){damage(e,d);if(++n>=max)break}}};
 const previousStart=start;
 start=function(cl){pulse=0;applied=0;active=cl;const result=previousStart(cl);if(p){p.v128Traits=p.v128Traits||{};applied=Object.values(p.v128Traits).reduce((a,b)=>a+b,0);}return result};
 const oldDamage=damage;

  if(b===0){for(let i=0;i<6;i++){const t=i*Math.PI/3+a*.4;circle(Math.cos(t)*r*.6,Math.sin(t)*r*.6,r*.16)}line([[-r*.5,r*.5],[0,-r],[r*.55,r*.35]])}
  else if(b===1){circle(0,0,r*.65);line([[-r*.5,-r*.7],[0,r*.7],[r*.5,-r*.7]])}
  else{for(let i=-1;i<=1;i++)line([[i*r*.4,-r],[i*r*.3,r*.65],[i*r*.3+r*.15,r*.35]])}
 }else if(cl===5){ // 御劍、太極龍、機關
  if(b===0){for(let i=0;i<7;i++){g.save();g.rotate(i*Math.PI*2/7+a*.25);line([[0,-r],[r*.1,-r*.3],[0,0],[-r*.1,-r*.3]]);g.restore()}}
  else if(b===1){circle(0,0,r*.75);g.beginPath();g.moveTo(0,-r*.75);g.bezierCurveTo(r*.75,-r*.25,-r*.75,r*.25,0,r*.75);g.stroke();circle(-r*.18,-r*.34,r*.09);circle(r*.18,r*.34,r*.09)}
  else{for(let i=0;i<6;i++){g.save();g.rotate(i*Math.PI/3+a*.25);g.strokeRect(-r*.18,-r*.7,r*.36,r*.32);g.restore()}circle(0,0,r*.3)}
 }else{ // 槍管、無人機、軌道平台
  if(b===0){g.strokeRect(-r*.7,-r*.18,r*1.4,r*.36);g.strokeRect(-r*.22,-r*.45,r*.44,r*.9);circle(0,0,r*.15)}
  else if(b===1){for(let i=0;i<4;i++){const t=i*Math.PI/2+a*.3;g.save();g.translate(Math.cos(t)*r*.72,Math.sin(t)*r*.72);g.strokeRect(-r*.2,-r*.12,r*.4,r*.24);circle(0,0,r*.08);g.restore()}}
  else{g.strokeRect(-r*.6,-r*.6,r*1.2,r*1.2);circle(0,0,r*.45);line([[0,-r],[0,r]]);line([[-r,0],[r,0]])}
 }
 g.restore();
}
const prevDraw=draw;
draw=function(){prevDraw();if(mode!=='play'||!p||!active.length)return;
 g.save();g.translate(w/2-p.x,h/2-p.y);
 for(const {b} of active){const cl=p.heroClass;if(cl<0||cl>6)continue;const ang=clock*.8+b*Math.PI*2/3;const dist=66+b*13;const x=p.x+Math.cos(ang)*dist,y=p.y+Math.sin(ang)*dist;shape(cl,b,x,y,20+b*3)}
 for(const s of sparks){g.save();g.globalAlpha=Math.max(0,s.life/s.max);g.strokeStyle=s.col;g.shadowColor=s.col;g.shadowBlur=15;g.lineWidth=3;g.beginPath();g.arc(s.x,s.y,35*(1-s.life/s.max)+9,0,Math.PI*2);g.stroke();g.restore()}
 g.restore();
};
globalThis.v132ManifestStatus=()=>({class:p?.heroClass,manifestations:active.map(x=>({name:names[p.heroClass]?.[x.b],branch:x.b,route:x.route})),hits:sparks.length});
})();
</script>
<script>
/* V133：平滑光暈與召喚物動態軌跡，保留職業技能原有判定。 */
(()=>{
'use strict';
const colors=[['#ffd28a','#8db7ed','#ffcc83'],['#d4b3ff','#90efff','#bba2ff'],['#a6ffd2','#a7e87c','#d9baff'],['#ffe3aa','#fff0c1','#9fffd5'],['#ff9d6b','#ff7a9c','#d895ff'],['#8af4e6','#8de8bd','#ffd39b'],['#a2d9ff','#becfff','#8ff4ff']];
let time=0, wisps=[], seeded=0;
const oldStart=start;
start=function(cl){time=0;wisps=[];seeded=0;return oldStart(cl)};
const oldTick=tick;
tick=function(dt){const ret=oldTick(dt);if(mode!=='play'||!p)return ret;
 const step=Math.max(0,Math.min(.06,Number(dt)||0));time+=step;
 const st=globalThis.v132ManifestStatus?.();const list=st?.manifestations||[];
 // 每秒少量柔光粒子，限制上限，避免後期怪物多時降低幀率。
 if(list.length){seeded+=step*Math.min(25,8+list.length*5);
  while(seeded>=1){seeded--;const a=list[Math.floor(Math.random()*list.length)];const b=a.branch;
   const angle=time*.8+b*Math.PI*2/3,dist=66+b*13;
   const x=p.x+Math.cos(angle)*dist,y=p.y+Math.sin(angle)*dist;
   const phase=Math.random()*Math.PI*2;
   wisps.push({x:x+Math.cos(phase)*18,y:y+Math.sin(phase)*18,vx:Math.cos(phase)*15,vy:Math.sin(phase)*15-9,life:.65+Math.random()*.35,max:1,col:colors[p.heroClass]?.[b]||'#aeeaff',r:2+Math.random()*3});
  }
 }
 for(let i=wisps.length-1;i>=0;i--){const w=wisps[i];w.life-=step;w.x+=w.vx*step;w.y+=w.vy*step;if(w.life<=0)wisps.splice(i,1)}
 if(wisps.length>85)wisps.splice(0,wisps.length-85);
 return ret;
};
const oldDraw=draw;
draw=function(){
 // Canvas 線端與折角統一圓潤化；保留槍械、盾牌等需要辨識度的輪廓。
 g.save();g.lineCap='round';g.lineJoin='round';oldDraw();g.restore();
 if(mode!=='play'||!p||!wisps.length)return;
 g.save();g.translate(w/2-p.x,h/2-p.y);g.globalCompositeOperation='lighter';
 for(const q of wisps){const alpha=Math.max(0,Math.min(1,q.life/q.max));
  g.globalAlpha=alpha*.55;
  const radius=q.r*(.7+(1-alpha)*.6);
  const grad=g.createRadialGradient(q.x,q.y,0,q.x,q.y,radius*3);
  grad.addColorStop(0,q.col);grad.addColorStop(.28,q.col);grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad;g.beginPath();g.arc(q.x,q.y,radius*3,0,Math.PI*2);g.fill();
 }
 g.restore();
};
globalThis.v133SmoothStatus=()=>({wisps:wisps.length,animated:!!globalThis.v132ManifestStatus?.()?.manifestations?.length});
})();
</script>
<script>
/* V134：職業差異化的平滑能量軌跡；依時間取樣，避免折角與過度繪製。 */
(()=>{
'use strict';
let elapsed=0, trails=[], glowDust=[], spawnAcc=0;
const palettes=[['#ffd9a1','#8db8ff','#fff0ad'],['#d5a9ff','#9deeff','#a68aff'],['#b2f9ce','#9ddd78','#d8c3ff'],['#ffe9b0','#fff4c7','#a6ffd9'],['#ffac72','#ff7897','#c596ff'],['#9cf8e7','#9ddbc9','#ffd49b'],['#9bd9ff','#bad3ff','#8ef5ff']];
const oldStart=start;
start=function(...args){elapsed=0;trails=[];glowDust=[];spawnAcc=0;return oldStart.apply(this,args)};
const oldTick=tick;
tick=function(dt){const result=oldTick.call(this,dt);if(mode!=='play'||!p)return result;
 const d=Math.max(0,Math.min(.05,Number(dt)||0));elapsed+=d;
 const manifest=globalThis.v132ManifestStatus?.()?.manifestations||[];
 for(const m of manifest){const b=m.branch,cl=p.heroClass;
  if(!Number.isInteger(b)||cl<0||cl>6)continue;
  const a=elapsed*.8+b*Math.PI*2/3,dist=66+b*13;
  const x=p.x+Math.cos(a)*dist,y=p.y+Math.sin(a)*dist;
  let tr=trails.find(t=>t.cl===cl&&t.b===b);
  if(!tr){tr={cl,b,points:[],carry:0};trails.push(tr)}
  tr.carry+=d;
  if(tr.carry>=1/35){tr.carry=0;tr.points.push({x,y,age:0});if(tr.points.length>22)tr.points.shift()}
 }
 const active=new Set(manifest.map(m=>p.heroClass+':'+m.branch));
 for(let i=trails.length-1;i>=0;i--){const t=trails[i];for(const pt of t.points)pt.age+=d;
  t.points=t.points.filter(pt=>pt.age<.7);if(!active.has(t.cl+':'+t.b)&&!t.points.length)trails.splice(i,1)}
 // 粒子依時間生成而非依影格生成；僅針對已解鎖的召喚物。
 spawnAcc+=d*Math.min(24,manifest.length*6);
 while(spawnAcc>=1&&glowDust.length<95&&manifest.length){spawnAcc--;
  const m=manifest[Math.floor(Math.random()*manifest.length)],b=m.branch,cl=p.heroClass;
  const a=elapsed*.8+b*Math.PI*2/3,dist=66+b*13;
  const cx=p.x+Math.cos(a)*dist,cy=p.y+Math.sin(a)*dist;
  const phase=Math.random()*Math.PI*2;
  glowDust.push({x:cx+Math.cos(phase)*12,y:cy+Math.sin(phase)*12,
   vx:Math.cos(phase)*(12+Math.random()*18),vy:Math.sin(phase)*(12+Math.random()*18),
   life:.35+Math.random()*.35,max:.7,cl,b,size:1.5+Math.random()*2.2});
 }
 for(let i=glowDust.length-1;i>=0;i--){const q=glowDust[i];q.life-=d;q.x+=q.vx*d;q.y+=q.vy*d;
  if(q.life<=0)glowDust.splice(i,1)}
 return result;
};
function strokeTrail(points,color,width){if(points.length<3)return;
 const first=points[0],last=points[points.length-1];
 const gr=g.createLinearGradient(first.x,first.y,last.x+.001,last.y+.001);
 gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.45,color);gr.addColorStop(1,'#ffffff');
 g.strokeStyle=gr;g.lineWidth=width;g.beginPath();g.moveTo(first.x,first.y);
 for(let i=1;i<points.length-1;i++){const a=points[i],b=points[i+1];g.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2)}
 g.lineTo(last.x,last.y);g.stroke();
}
function smoothSymbol(cl,b,x,y,t){
 const col=palettes[cl]?.[b]||'#aeefff';
 g.save();g.translate(x,y);g.rotate(Math.sin(t*1.2+b)*.15);
 g.lineCap='round';g.lineJoin='round';g.strokeStyle=col;g.fillStyle=col;
 // 各職業的能量流動型態不同：劍弧、法環、風葉、聖光、火舌、氣旋、電子脈衝。
 const n=cl===6?4:cl===3?6:cl===1?5:3;
 if(cl===0||cl===5){
  for(let k=0;k<2;k++){const a=t*1.1+k*Math.PI;
   g.save();g.rotate(a);g.lineWidth=2.3;g.beginPath();g.moveTo(-16,6);
   g.quadraticCurveTo(0,-24,18,-5);g.stroke();g.restore()}
 }else if(cl===1){
  for(let k=0;k<n;k++){const a=k*Math.PI*2/n+t*.35;
   g.beginPath();g.arc(Math.cos(a)*16,Math.sin(a)*16,2.8,0,Math.PI*2);g.fill()}
  g.beginPath();g.ellipse(0,0,19,11,t*.45,0,Math.PI*2);g.lineWidth=1.6;g.stroke();
 }else if(cl===2){
  for(let k=0;k<3;k++){g.save();g.rotate(k*Math.PI*2/3+t*.4);g.beginPath();g.moveTo(0,0);
   g.bezierCurveTo(4,-9,14,-17,20,-19);g.bezierCurveTo(12,-9,9,-3,0,0);g.fill();g.restore()}
 }else if(cl===3){
  for(let k=0;k<4;k++){g.save();g.rotate(k*Math.PI/2);g.beginPath();g.ellipse(0,-13,4,11,0,0,Math.PI*2);g.globalAlpha=.32;g.fill();g.restore()}
  g.globalAlpha=.8;g.beginPath();g.arc(0,0,5,0,Math.PI*2);g.fill();
 }else if(cl===4){
  for(let k=0;k<3;k++){g.save();g.rotate(k*Math.PI*2/3);g.beginPath();g.moveTo(0,12);
   g.bezierCurveTo(-15,0,10,-9,0,-23);g.bezierCurveTo(16,-8,10,3,0,12);g.globalAlpha=.42;g.fill();g.restore()}
 }else{
  for(let k=0;k<4;k++){const a=t*.6+k*Math.PI/2;g.beginPath();g.arc(Math.cos(a)*14,Math.sin(a)*14,3,0,Math.PI*2);g.fill()}
  g.beginPath();g.arc(0,0,9,0,Math.PI*2);g.lineWidth=2;g.stroke();
 }
 g.restore();
}
const oldDraw=draw;
draw=function(){oldDraw.call(this);if(mode!=='play'||!p||(!trails.length&&!glowDust.length))return;
 g.save();g.translate(w/2-p.x,h/2-p.y);g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
 for(const tr of trails){const pts=tr.points;if(pts.length<3)continue;
  const color=palettes[tr.cl]?.[tr.b]||'#aeefff';
  g.save();g.globalAlpha=.12;g.shadowColor=color;g.shadowBlur=13;strokeTrail(pts,color,11);g.restore();
  g.save();g.globalAlpha=.65;strokeTrail(pts,color,2.8);g.restore();
  const end=pts[pts.length-1];smoothSymbol(tr.cl,tr.b,end.x,end.y,elapsed);
 }
 for(const q of glowDust){const alpha=Math.max(0,Math.min(1,q.life/q.max));
  const c=palettes[q.cl]?.[q.b]||'#ffffff';g.globalAlpha=alpha*.42;g.fillStyle=c;
  g.beginPath();g.arc(q.x,q.y,q.size*(.6+alpha),0,Math.PI*2);g.fill();
 }
 g.restore();
};
globalThis.v134EffectStatus=()=>({trails:trails.length,particles:glowDust.length,style:'smooth-class-specific'});
})();
</script>

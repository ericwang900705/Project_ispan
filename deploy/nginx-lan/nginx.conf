# Windows 同 Wi-Fi 展示設定。此檔位於 Nginx/conf/nginx.conf。
worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    map $http_upgrade $hero_connection { default upgrade; '' close; }
    server {
        listen 80;
        server_name 192.168.36.122 localhost 127.0.0.1;
        root html/hero;
        index index.html;
        charset utf-8;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        # 保留 /api 與原始 URI；proxy_pass 不加結尾斜線。
        location ^~ /api/ {
            include hero-proxy.conf;
        }
        # 客服使用 SSE；禁用回應緩衝，避免訊息及在線狀態延遲。
        location = /api/events {
            include hero-proxy.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            gzip off;
            add_header X-Accel-Buffering no;
        }
        location ^~ /uploads/ {
            include hero-proxy.conf;
        }
        location ^~ /ws/ {
            include hero-proxy.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $hero_connection;
            proxy_read_timeout 3600s;
        }
        # 找不到的靜態素材應回 404，不回傳 index.html 冒充圖片或 ZIP。
        location ~* \.(?:js|css|png|jpe?g|gif|webp|svg|ico|mp4|zip|woff2?|html)$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

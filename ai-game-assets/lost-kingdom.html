<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失落王國：勇者傳說</title><style>body{margin:0;background:#101827;color:#e8f4ff;font-family:system-ui,'Microsoft JhengHei',sans-serif;text-align:center}header{padding:12px}h1{margin:4px;color:#ffd778}.wrap{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}canvas{background:#244d39;border:4px solid #91a86c;border-radius:10px;max-width:95vw;image-rendering:pixelated}aside{width:260px;text-align:left;background:#1d2a40;padding:15px;border-radius:12px}button{background:#e8b95a;border:0;border-radius:7px;padding:9px 12px;margin:4px;cursor:pointer;font-weight:bold}button:hover{background:#ffe08c}.small{font-size:13px;color:#b9c8d6}#log{min-height:65px;color:#ffd778}#overlay{position:fixed;inset:0;background:#07101bdc;display:flex;align-items:center;justify-content:center;z-index:3}.panel{background:#20334a;padding:28px;border:2px solid #e8b95a;border-radius:16px;max-width:480px}#overlay.hidden{display:none}#touch{margin:10px}#touch button{min-width:52px}

</style></head><body><header><h1>⚔️ 失落王國：勇者傳說</h1><div class="small">素材收集・裝備分解・鍛造合成・每日委託・衝刺閃避</div></header><div class="wrap"><canvas id="game" width="768" height="512"></canvas><aside><h3>🛡️ 勇者狀態</h3><div id="stats"></div><hr><h3>🎒 背包與任務</h3><div id="extras"></div><div id="quest"></div><hr><div id="log"></div><button onclick="openSkills()">🌟 技能樹 K</button><button onclick="openJournal()">📖 日誌 J</button><button onclick="save()">💾 儲存</button><button onclick="load()">📂 讀取</button><button onclick="restart()">🔄 重來</button><button onclick="openShop()">🏪 商店</button><p class="small">WASD / 方向鍵：移動<br>空白鍵：攻擊　Q：技能<br>E：互動　H：喝藥水　K：技能樹　J：冒險日誌<br>靠近村民按 E 接任務；靠近商人按 E 購物<br>擊敗敵人會獲得經驗值。</p></aside></div><div id="touch"><button data-key="ArrowUp">↑</button><br><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button><button data-key="Space">⚔️</button><button data-key="KeyQ">✨</button><button data-key="KeyE">E</button><button data-key="KeyH">🧪</button></div><div id="overlay"><div class="panel"><h2>🏰 失落王國</h2><p>黑暗籠罩王國。你必須走過森林、荒漠與地下城，蒐集三枚聖物，才有機會擊敗暗影魔王。</p><h3>選擇你的職業</h3><button onclick="start('戰士')">🛡️ 戰士<br>高生命</button><button onclick="start('法師')">🔮 法師<br>強技能</button><button onclick="start('弓箭手')">🏹 弓箭手<br>高移速</button><p class="small">靠近傳送門並按 E 前往下一區域。</p></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),T=32,W=24,H=16;const areas=['翠綠森林','灼熱荒漠','幽暗地牢','魔王城'];let p,enemies=[],items=[],area=0,keys={},message='',last=0,over=false,won=false;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function say(s){message=s;document.getElementById('log').textContent=s}function start(job){p={x:2,y:8,job,level:1,xp:0,hp:job==='戰士'?140:100,maxHp:job==='戰士'?140:100,mp:job==='法師'?110:70,maxMp:job==='法師'?110:70,atk:job==='法師'?15:job==='弓箭手'?22:25,gold:0,potions:3,relics:0,kills:0,dir:1};area=0;over=false;won=false;document.getElementById('overlay').classList.add('hidden');populate();say('旅程開始！打敗怪物、開啟寶箱並尋找右方傳送門。')}function restart(){localStorage.removeItem('lostKingdomSave');document.getElementById('overlay').classList.remove('hidden')}function populate(){enemies=[];items=[];for(let i=0;i<(area===3?1:5+area*2);i++){let x=rand(5,20),y=rand(2,13);enemies.push({x,y,hp:area===3?360:35+area*23,maxHp:area===3?360:35+area*23,atk:area===3?18:5+area*3,boss:area===3,move:0})}for(let i=0;i<4;i++)items.push({x:rand(4,20),y:rand(2,13),type:i===0&&area<3?'relic':i===1?'potion':'chest'});p.x=2;p.y=8}function occupied(x,y){return x<1||x>22||y<1||y>14||((x*7+y*11+area*3)%31===0)}function hit(dmg,range=1){let target=enemies.filter(e=>Math.abs(e.x-p.x)+Math.abs(e.y-p.y)<=range).sort((a,b)=>Math.abs(a.x-p.x)+Math.abs(a.y-p.y)-Math.abs(b.x-p.x)-Math.abs(b.y-p.y))[0];if(!target){say('攻擊落空，靠近敵人！');return}target.hp-=dmg;if(target.hp<=0){enemies.splice(enemies.indexOf(target),1);p.gold+=target.boss?200:rand(8,18);p.xp+=target.boss?100:20;p.kills++;say(target.boss?'暗影魔王被擊敗！王國恢復和平！':'擊敗怪物！獲得經驗與金幣。');if(target.boss){won=true;showEnd('🏆 勇者凱旋！','你擊敗了暗影魔王，拯救失落王國！')}if(p.xp>=p.level*50){p.xp-=p.level*50;p.level++;p.maxHp+=20;p.maxMp+=10;p.atk+=5;p.hp=p.maxHp;p.mp=p.maxMp;say('升級！你現在是 Lv.'+p.level)}}else say('命中敵人，造成 '+dmg+' 傷害！')}function action(code){if(!p||over||won)return;if(code==='Space')hit(p.atk,1);if(code==='KeyQ'){if(p.mp<15){say('魔力不足！');return}p.mp-=15;hit(p.atk*(p.job==='法師'?4:2),p.job==='弓箭手'?5:3)}if(code==='KeyH'){if(p.potions>0){p.potions--;p.hp=Math.min(p.maxHp,p.hp+60);say('恢復 60 點生命值。')}else say('沒有藥水了！')}if(code==='KeyE'){let it=items.find(i=>Math.abs(i.x-p.x)+Math.abs(i.y-p.y)<=1);if(it){items.splice(items.indexOf(it),1);if(it.type==='relic'){p.relics++;say('獲得古代聖物！ '+p.relics+'/3')}else if(it.type==='potion'){p.potions+=2;say('找到 2 瓶生命藥水！')}else{let g=rand(20,60);p.gold+=g;say('打開寶箱，獲得 '+g+' 金幣！')}}else if(p.x>=21&&Math.abs(p.y-8)<=2){if(area===2&&p.relics<3){say('需要三枚古代聖物才能進入魔王城！');return}if(area<3){area++;populate();say('進入 '+areas[area]+'！')}else say('擊敗魔王即可通關！')}else say('靠近寶箱、聖物或傳送門再按 E。')}}let moveCooldown=0,enemyCooldown=0;function update(dt){if(!p||over||won)return;moveCooldown-=dt;enemyCooldown-=dt;if(moveCooldown<=0){let dx=0,dy=0;if(keys.ArrowUp||keys.KeyW)dy=-1;else if(keys.ArrowDown||keys.KeyS)dy=1;else if(keys.ArrowLeft||keys.KeyA)dx=-1;else if(keys.ArrowRight||keys.KeyD)dx=1;if(dx||dy){if(!occupied(p.x+dx,p.y+dy)&&!enemies.some(e=>e.x===p.x+dx&&e.y===p.y+dy)){p.x+=dx;p.y+=dy}moveCooldown=p.job==='弓箭手'?95:140}}if(enemyCooldown<=0){for(const e of enemies){let d=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);if(d<=1){p.hp-=e.atk;if(p.hp<=0){p.hp=0;over=true;showEnd('💀 冒險失敗','你的勇者倒下了。可以重新開始或讀取存檔。');break}}else if(d<7&&Math.random()<.75){let dx=Math.abs(p.x-e.x)>Math.abs(p.y-e.y)?Math.sign(p.x-e.x):0,dy=dx?0:Math.sign(p.y-e.y);if(!occupied(e.x+dx,e.y+dy)&&!(e.x+dx===p.x&&e.y+dy===p.y)&&!enemies.some(o=>o!==e&&o.x===e.x+dx&&o.y===e.y+dy)){e.x+=dx;e.y+=dy}}}p.mp=Math.min(p.maxMp,p.mp+2);enemyCooldown=650}}function showEnd(title,desc){document.getElementById('overlay').classList.remove('hidden');document.querySelector('.panel').innerHTML=`<h2>${title}</h2><p>${desc}</p><p>等級 ${p.level}｜擊敗 ${p.kills} 隻敵人｜金幣 ${p.gold}</p><button onclick="restart()">重新冒險</button><button onclick="load()">讀取存檔</button>`}function draw(){ctx.fillStyle=['#315b40','#82623a','#38394c','#3a203c'][area];ctx.fillRect(0,0,768,512);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=(x+y)%2?'#ffffff08':'#00000008';ctx.fillRect(x*T,y*T,T,T);if(occupied(x,y)){ctx.fillStyle=area===0?'#21452d':area===1?'#675030':'#252638';ctx.fillRect(x*T+5,y*T+5,22,22);ctx.fillStyle='#ffffff22';ctx.fillRect(x*T+10,y*T+5,6,8)}}ctx.fillStyle='#ae79fa';ctx.fillRect(22*T,7*T,32,96);ctx.fillStyle='#f5d4ff';ctx.font='23px sans-serif';ctx.fillText('✦',22*T+5,8*T+20);ctx.font='12px sans-serif';ctx.fillStyle='#fff';ctx.fillText('傳送門',21*T,6*T+12);for(const i of items){ctx.font='25px sans-serif';ctx.fillText(i.type==='relic'?'💎':i.type==='potion'?'🧪':'🎁',i.x*T+3,i.y*T+26)}for(const e of enemies){ctx.font=e.boss?'32px sans-serif':'25px sans-serif';ctx.fillText(e.boss?'👹':area===0?'🐺':area===1?'🦂':'👻',e.x*T,e.y*T+27);ctx.fillStyle='#310c18';ctx.fillRect(e.x*T,e.y*T-6,30,4);ctx.fillStyle='#fb5b65';ctx.fillRect(e.x*T,e.y*T-6,30*Math.max(0,e.hp/e.maxHp),4)}if(p){ctx.font='28px sans-serif';ctx.fillText(p.job==='戰士'?'🛡️':p.job==='法師'?'🧙':'🏹',p.x*T,p.y*T+27)}ctx.fillStyle='#0009';ctx.fillRect(0,0,768,32);ctx.fillStyle='#fff';ctx.font='bold 17px sans-serif';ctx.fillText('📍 '+areas[area]+'   |   第 '+(area+1)+'/4 區域',12,22);if(p){document.getElementById('stats').innerHTML=`職業：${p.job}　Lv.${p.level}<br>❤️ HP：${p.hp} / ${p.maxHp}<br>🔷 MP：${p.mp} / ${p.maxMp}<br>⚔️ 攻擊：${p.atk}<br>⭐ 經驗：${p.xp} / ${p.level*50}<br>💰 金幣：${p.gold}<br>🧪 藥水：${p.potions}`;document.getElementById('quest').innerHTML=`💎 古代聖物：${p.relics}/3<br>👾 擊敗怪物：${p.kills}<br>🚪 目前區域：${areas[area]}<br><br>${area<3?'尋找聖物並前往下一區域。':'擊敗暗影魔王！'}`}}function loop(t){let dt=Math.min(t-last,50);last=t;update(dt);draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!keys[e.code])action(e.code);keys[e.code]=true});document.addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('#touch button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();let k=b.dataset.key;keys[k]=true;action(k)});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys[b.dataset.key]=false)});function save(){if(!p)return;localStorage.setItem('lostKingdomSave',JSON.stringify({p,area,enemies,items}));say('進度已儲存！')}function load(){let s=localStorage.getItem('lostKingdomSave');if(!s){say('沒有存檔。');return}try{let v=JSON.parse(s);p=v.p;area=v.area;enemies=v.enemies;items=v.items;over=false;won=false;document.getElementById('overlay').classList.add('hidden');say('成功讀取存檔！')}catch(e){say('存檔無法讀取。')}}// V2：村民支線、旅行商人、裝備及商店
let questAccepted=false,questClaimed=false,questStartKills=0,weaponTier=0,armorTier=0;
const shopList=[{name:'🧪 生命藥水 × 2',cost:35,kind:'potion'},{name:'🗡️ 鋼鐵長劍（攻擊 + 12）',cost:100,kind:'weapon'},{name:'🛡️ 守護盔甲（生命上限 + 40）',cost:120,kind:'armor'},{name:'✨ 魔力水晶（魔力上限 + 30）',cost:80,kind:'mana'}];
function nearNpc(x,y){return area===0&&Math.abs(p.x-x)+Math.abs(p.y-y)<=2}
function openShop(){if(!p||over||won)return;keys={};let el=document.getElementById('shopOverlay');el.style.display='flex';el.classList.remove('hidden');refreshShop()}
function closeShop(){document.getElementById('shopOverlay').style.display='none'}
function refreshShop(){document.getElementById('shopGold').textContent='💰 目前金幣：'+p.gold;document.getElementById('shopItems').innerHTML=shopList.map((i,n)=>`<div style="padding:7px;border-bottom:1px solid #ffffff33">${i.name} — ${i.cost} 金幣 <button onclick="buy(${n})">購買</button></div>`).join('')}
function buy(n){let i=shopList[n];if(p.gold<i.cost){say('金幣不足！');return}if(i.kind==='weapon'&&weaponTier){say('已購買鋼鐵長劍！');return}if(i.kind==='armor'&&armorTier){say('已購買守護盔甲！');return}p.gold-=i.cost;if(i.kind==='potion')p.potions+=2;if(i.kind==='weapon'){weaponTier=1;p.atk+=12}if(i.kind==='armor'){armorTier=1;p.maxHp+=40;p.hp+=40}if(i.kind==='mana'){p.maxMp+=30;p.mp+=30}say('購買成功：'+i.name);refreshShop()}
const originalAction=action;
action=function(code){if(document.getElementById('shopOverlay').style.display==='flex')return;if(code==='KeyE'&&p&&!over&&!won){if(nearNpc(3,3)){if(!questAccepted){questAccepted=true;questStartKills=p.kills;say('村長：請替村莊消滅 3 隻怪物！完成後回來找我。')}else if(!questClaimed&&p.kills-questStartKills>=3){questClaimed=true;p.gold+=120;p.potions+=2;say('村長：謝謝你！獲得 120 金幣及 2 瓶藥水！')}else say(questClaimed?'村長：你是村莊的英雄！':'村長：還需要擊敗 '+Math.max(0,3-(p.kills-questStartKills))+' 隻怪物。');return}if(nearNpc(5,3)){openShop();return}}originalAction(code)};
const originalDraw=draw;
draw=function(){originalDraw();if(!p)return;if(area===0){ctx.font='27px sans-serif';ctx.fillText('🧓',3*T,3*T+27);ctx.fillText('🧑‍💼',5*T,3*T+27);ctx.font='12px sans-serif';ctx.fillStyle='#fff';ctx.fillText('村長',3*T,3*T-4);ctx.fillText('商人',5*T,3*T-4)}ctx.fillStyle='#0b1425cc';ctx.fillRect(630,38,124,94);ctx.fillStyle='#f5dc99';ctx.font='11px sans-serif';ctx.fillText('🗺️ 小地圖',638,51);ctx.strokeStyle='#d1b985';ctx.strokeRect(638,57,107,65);for(const e of enemies){ctx.fillStyle=e.boss?'#ff9a33':'#fb6974';ctx.fillRect(638+e.x*4.4,57+e.y*3.8,4,4)}ctx.fillStyle='#72f1b1';ctx.fillRect(638+p.x*4.4,57+p.y*3.8,5,5);document.getElementById('extras').innerHTML=`🗡️ 武器：${weaponTier?'鋼鐵長劍':'初始武器'}<br>🛡️ 盔甲：${armorTier?'守護盔甲':'初始護甲'}<br>📜 村長任務：${questClaimed?'✅ 已完成':questAccepted?'擊敗怪物 '+Math.min(3,p.kills-questStartKills)+'/3':'尚未接取'}<br><br>`};
const originalSave=save;
save=function(){originalSave();if(!p)return;let v=JSON.parse(localStorage.getItem('lostKingdomSave'));v.v2={questAccepted,questClaimed,questStartKills,weaponTier,armorTier};localStorage.setItem('lostKingdomSave',JSON.stringify(v))};
const originalLoad=load;
load=function(){originalLoad();let raw=localStorage.getItem('lostKingdomSave');if(!raw)return;let v=JSON.parse(raw).v2||{};questAccepted=!!v.questAccepted;questClaimed=!!v.questClaimed;questStartKills=v.questStartKills||0;weaponTier=v.weaponTier||0;armorTier=v.armorTier||0;closeShop()};
const originalStart=start;
start=function(job){questAccepted=false;questClaimed=false;questStartKills=0;weaponTier=0;armorTier=0;closeShop();originalStart(job)};
requestAnimationFrame(loop);
</script><div id="shopOverlay" class="hidden" style="position:fixed;inset:0;background:#000b;z-index:5;display:none;align-items:center;justify-content:center"><div class="panel" style="max-width:460px"><h2>🏪 旅行商人的商店</h2><p id="shopGold"></p><div id="shopItems"></div><button onclick="closeShop()">離開商店 ✕</button></div></div><div id="v3Overlay" style="display:none;position:fixed;inset:0;background:#000c;z-index:8;align-items:center;justify-content:center;padding:12px"><div class="panel" style="width:min(500px,95vw);max-height:85vh;overflow:auto"><h2 id="v3Title"></h2><div id="v3Content" style="text-align:left;line-height:1.8"></div><button onclick="closeV3()">關閉 ✕</button></div></div>
<script>
// V3：技能樹、精英怪、探索里程碑與區域挑戰
let skillPoints=0, skillLevels=[0,0,0], journal=[], zoneClears=[false,false,false,false], eliteRewarded=[false,false,false];
function recordV3(t){journal.unshift(new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'　'+t);journal=journal.slice(0,35)}
function openV3(title,html){if(!p)return;keys={};document.getElementById('v3Title').textContent=title;document.getElementById('v3Content').innerHTML=html;document.getElementById('v3Overlay').style.display='flex'}
function closeV3(){document.getElementById('v3Overlay').style.display='none'}
function openSkills(){if(!p)return;openV3('🌟 勇者技能樹',`<p>可用技能點：<b>${skillPoints}</b>（每升一級獲得 1 點）</p>`+[
['💪 強化體魄','生命上限 +25'],['⚔️ 武藝精通','攻擊力 +5'],['🔮 魔力泉源','魔力上限 +20']
].map((x,i)=>`<div style="border-bottom:1px solid #ffffff44;padding:9px">${x[0]} Lv.${skillLevels[i]}/5<br><small>${x[1]}</small> <button ${skillPoints<=0||skillLevels[i]>=5?'disabled':''} onclick="upgradeSkill(${i})">升級（1 點）</button></div>`).join(''))}
function upgradeSkill(i){if(skillPoints<=0||skillLevels[i]>=5)return;skillPoints--;skillLevels[i]++;if(i===0){p.maxHp+=25;p.hp+=25}if(i===1)p.atk+=5;if(i===2){p.maxMp+=20;p.mp+=20}recordV3('提升技能：'+['強化體魄','武藝精通','魔力泉源'][i]);openSkills()}
function openJournal(){if(!p)return;openV3('📖 冒險日誌',`<p>地區挑戰：${areas.map((a,i)=>a+' '+(zoneClears[i]?'✅':'⬜')).join('、')}</p><p>技能點：${skillPoints}｜技能等級：${skillLevels.join(' / ')}</p><hr>`+(journal.length?journal.map(x=>`<div>• ${x.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`).join(''):'尚無紀錄'))}
const v3Start=start;start=function(job){skillPoints=0;skillLevels=[0,0,0];journal=[];zoneClears=[false,false,false,false];eliteRewarded=[false,false,false];closeV3();v3Start(job);recordV3('選擇'+job+'，踏上旅途');addElite()};

const v6OldAction=action;action=function(code){if(code==='KeyT'){v6OpenTown();return}if(code==='KeyM'){v6OpenQuest();return}if(v6Modal.style.display==='flex'){if(code==='Escape')v6Close();return}v6OldAction(code)};
const v6OldHit=hit;hit=function(dmg,range=1){if(!p)return;let before=p.kills;v6OldHit(dmg,range);if(p.kills>before&&v4Pet){v6PetXP++;if(v6PetXP%6===0){p.atk+=2;say('🐾 寵物羈絆提升！額外獲得 2 點攻擊力。')}}};
const v6OldUpdate=update;update=function(dt){if(v6Modal.style.display==='flex')return;v6OldUpdate(dt);if(!p||over||won)return;v6EventTimer+=dt;v6BossPulse=Math.max(0,v6BossPulse-dt);if(v6EventTimer>45000){v6EventTimer=0;v6Event=['平靜','魔力潮汐','金幣祝福','治癒微風'][rand(0,3)];say('🌠 世界事件：'+v6Event)}if(v6Event==='治癒微風'&&Math.random()<.015)p.hp=Math.min(p.maxHp,p.hp+1);if(v6Event==='魔力潮汐'&&Math.random()<.04)p.mp=Math.min(p.maxMp,p.mp+1);if(v6Event==='金幣祝福'&&Math.random()<.002)p.gold++;if(enemies.some(e=>e.boss||e.v5Boss)&&v6BossPulse<=0){v6BossPulse=5000;if(Math.abs(p.x-12)+Math.abs(p.y-8)<4){p.hp=Math.max(1,p.hp-4);say('⚠️ 首領釋放暗影衝擊！')}}};
const v6OldDraw=draw;draw=function(){v6OldDraw();if(!p)return;v6Status.innerHTML='🏘️ 城鎮：'+v6TownNames[area]+'<br>📜 主線章節：'+Math.min(v6QuestStep+1,3)+'/3<br>🐾 寵物羈絆：'+v6PetXP+'<br>⚒️ 鍛造次數：'+v6ForgeCount+'<br>🌠 世界事件：'+v6Event;ctx.save();ctx.fillStyle='#e2d7b9';ctx.font='bold 13px sans-serif';ctx.fillText('T 城鎮 · M 主線',540,48);ctx.restore()};
const v6OldSave=save;save=function(){v6OldSave();if(!p)return;try{let v=JSON.parse(localStorage.getItem('lostKingdomSave'));v.v6={townVisits:v6TownVisits,questStep:v6QuestStep,petXP:v6PetXP,forgeCount:v6ForgeCount,eventTimer:v6EventTimer,event:v6Event};localStorage.setItem('lostKingdomSave',JSON.stringify(v))}catch(e){}};
const v6OldLoad=load;load=function(){v6OldLoad();if(!p)return;try{let v=JSON.parse(localStorage.getItem('lostKingdomSave'))?.v6||{};v6TownVisits=v.townVisits||0;v6QuestStep=v.questStep||0;v6PetXP=v.petXP||0;v6ForgeCount=v.forgeCount||0;v6EventTimer=v.eventTimer||0;v6Event=v.event||'平靜';v6Close()}catch(e){}};

// V7：素材、分解、合成、委託與衝刺；保留 V1~V6 功能。
let v7Materials={木材:0,礦石:0,魔晶:0},v7DailyKills=0,v7DailyClaimed=false,v7DodgeCooldown=0,v7DodgeFlash=0;
const v7Panel=document.createElement('div');v7Panel.id='v7Panel';v7Panel.style.cssText='display:none;position:fixed;inset:0;z-index:40;background:#06101de8;align-items:center;justify-content:center;padding:16px';
v7Panel.innerHTML='<div class="panel" style="max-width:620px;width:94vw;max-height:85vh;overflow:auto;text-align:left"><h2 id="v7Title"></h2><div id="v7Body"></div><button onclick="v7Close()">關閉 Esc</button></div>';document.body.appendChild(v7Panel);
const v7Menu=document.createElement('div');v7Menu.innerHTML='<hr><h3>✨ V7 冒險擴充</h3><button onclick="v7Open(\'materials\')">🪨 素材背包 (B)</button><button onclick="v7Open(\'forge\')">⚒️ 合成工坊 (F)</button><button onclick="v7Open(\'daily\')">📋 討伐委託 (L)</button><p class="small">Shift：向移動方向衝刺（冷卻 5 秒）<br>擊敗怪物取得素材；分解多餘裝備換取礦石。</p>';document.querySelector('aside').appendChild(v7Menu);
function v7Close(){v7Panel.style.display='none'}
function v7Open(tab){if(!p)return;keys={};let h='',title='';if(tab==='materials'){title='🎒 探險素材';h='<p>🌲 木材 '+v7Materials.木材+'　🪨 礦石 '+v7Materials.礦石+'　🔮 魔晶 '+v7Materials.魔晶+'</p><h3>武器收藏</h3>'+(v4Gear.length?v4Gear.map((g,i)=>'<p>'+ (i===v4Equipped?'🟢 ':'')+g.name+'　攻擊 +'+g.atk+' <button '+(i===v4Equipped?'disabled':'')+' onclick="v7Dismantle('+i+')">分解（礦石 +2）</button></p>').join(''):'<p>尚未取得武器。</p>')}
else if(tab==='forge'){title='⚒️ 王國合成工坊';h='<p>持有：木材 '+v7Materials.木材+'／礦石 '+v7Materials.礦石+'／魔晶 '+v7Materials.魔晶+'</p><p>🧪 草藥藥水 ×2（木材 3、魔晶 1） <button onclick="v7Craft(0)">合成</button></p><p>⚔️ 星輝長劍（礦石 8、魔晶 3） <button onclick="v7Craft(1)">合成</button></p><p>❤️ 生命護符（木材 5、礦石 5、魔晶 2） <button onclick="v7Craft(2)">合成</button></p>'}
else{title='📋 王國討伐委託';h='<p>本輪目標：擊敗 8 隻敵人。</p><p>進度：'+Math.min(v7DailyKills,8)+'/8</p><p>獎勵：150 金幣、2 魔晶、2 瓶藥水。</p><button onclick="v7Claim()" '+(v7DailyKills<8||v7DailyClaimed?'disabled':'')+'>領取獎勵</button><p>'+(v7DailyClaimed?'本輪委託已完成。可按下方按鈕開啟新一輪。':'每次完成後可接取下一輪。')+'</p>'+(v7DailyClaimed?'<button onclick="v7ResetDaily()">接受新委託</button>':'')}
document.getElementById('v7Title').textContent=title;document.getElementById('v7Body').innerHTML=h;v7Panel.style.display='flex'}
function v7Dismantle(i){if(i===v4Equipped||!v4Gear[i])return;v4Gear.splice(i,1);if(v4Equipped>i)v4Equipped--;v7Materials.礦石+=2;say('分解裝備，獲得 2 礦石。');v7Open('materials')}
function v7Craft(n){const costs=[{木材:3,魔晶:1},{礦石:8,魔晶:3},{木材:5,礦石:5,魔晶:2}][n];if(Object.entries(costs).some(([k,v])=>v7Materials[k]<v)){say('素材不足，無法合成。');return}for(const [k,v] of Object.entries(costs))v7Materials[k]-=v;if(n===0)p.potions+=2;if(n===1)v4Gear.push({name:'✨ 星輝長劍',atk:42});if(n===2){p.maxHp+=35;p.hp+=35}say(['合成兩瓶藥水！','合成星輝長劍！按 I 裝備。','生命護符使生命上限 +35！'][n]);v7Open('forge')}
function v7Claim(){if(v7DailyKills<8||v7DailyClaimed)return;v7DailyClaimed=true;p.gold+=150;p.potions+=2;v7Materials.魔晶+=2;say('完成討伐委託！獲得 150 金、2 魔晶與 2 瓶藥水。');v7Open('daily')}
function v7ResetDaily(){if(!v7DailyClaimed)return;v7DailyKills=0;v7DailyClaimed=false;v7Open('daily')}
const v7Start=start;start=function(job){v7Start(job);v7Materials={木材:0,礦石:0,魔晶:0};v7DailyKills=0;v7DailyClaimed=false;v7DodgeCooldown=0;v7Close()};
const v7Hit=hit;hit=function(dmg,range){if(!p)return;const oldKills=p.kills;v7Hit(dmg,range);const delta=p.kills-oldKills;if(delta>0){v7DailyKills+=delta;for(let j=0;j<delta;j++){const r=Math.random();if(r<.5)v7Materials.木材++;else if(r<.86)v7Materials.礦石++;else v7Materials.魔晶++}if(v7DailyKills>=8&&!v7DailyClaimed)say('📋 討伐委託達標！按 L 領取獎勵。')}};
function v7Dodge(){if(!p||over||won||v7DodgeCooldown>0)return;let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);if(!dx&&!dy)dx=p.dir||1;let moved=false;for(let i=0;i<3;i++){let nx=p.x+dx,ny=p.y+dy;if(occupied(nx,ny)||enemies.some(e=>e.x===nx&&e.y===ny))break;p.x=nx;p.y=ny;moved=true}if(moved){v7DodgeCooldown=5000;v7DodgeFlash=450;say('💨 衝刺成功！')}}
const v7Action=action;action=function(code){if(v7Panel.style.display==='flex'){if(code==='Escape'||['KeyB','KeyF','KeyL'].includes(code))v7Close();return}if(code==='KeyB'){v7Open('materials');return}if(code==='KeyF'){v7Open('forge');return}if(code==='KeyL'){v7Open('daily');return}if(code==='ShiftLeft'||code==='ShiftRight'){v7Dodge();return}v7Action(code)};
const v7Update=update;update=function(dt){if(v7Panel.style.display==='flex')return;v7DodgeCooldown=Math.max(0,v7DodgeCooldown-dt);v7DodgeFlash=Math.max(0,v7DodgeFlash-dt);v7Update(dt)};
const v7Draw=draw;draw=function(){v7Draw();if(!p)return;if(v7DodgeFlash>0){ctx.strokeStyle='#8beaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x*T+16,p.y*T+16,19,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#ffffff';ctx.font='12px sans-serif';ctx.fillText('💨 衝刺 '+(v7DodgeCooldown?Math.ceil(v7DodgeCooldown/1000)+'s':'就緒'),630,89)};
const v7Save=save;save=function(){v7Save();if(!p)return;try{let v=JSON.parse(localStorage.getItem('lostKingdomSave'));v.v7={materials:v7Materials,dailyKills:v7DailyKills,dailyClaimed:v7DailyClaimed};localStorage.setItem('lostKingdomSave',JSON.stringify(v))}catch(e){}};
const v7Load=load;load=function(){v7Load();if(!p)return;try{let v=JSON.parse(localStorage.getItem('lostKingdomSave'))?.v7||{};v7Materials={木材:Math.max(0,v.materials?.木材||0),礦石:Math.max(0,v.materials?.礦石||0),魔晶:Math.max(0,v.materials?.魔晶||0)};v7DailyKills=v.dailyKills||0;v7DailyClaimed=!!v.dailyClaimed;v7Close()}catch(e){}};
</script></body></html>

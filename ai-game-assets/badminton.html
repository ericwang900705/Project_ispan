<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火柴人羽毛球 V2</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1428;color:#eef6ff;font-family:Arial,'Microsoft JhengHei',sans-serif;text-align:center}h1{margin:16px 0 6px}.sub{color:#a9c4da;margin:6px}.panel{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px auto;max-width:1050px}label{font-size:14px}select,button{background:#1c3151;color:white;border:1px solid #547e9e;border-radius:9px;padding:10px;font-weight:bold}button{background:#38d6b3;color:#092032;border:0;cursor:pointer}button:hover{filter:brightness(1.12)}canvas{width:min(97vw,1000px);height:auto;border:3px solid #52d9d4;border-radius:14px;background:#9dd7ff}#status{color:#ffdf88;font-weight:bold;min-height:24px}.help{max-width:900px;margin:12px auto;color:#c8d9e7;line-height:1.9}kbd{background:#253d5e;border-radius:4px;padding:2px 6px}</style></head><body><h1>🏸 火柴人羽毛球 V2</h1><p class="sub">雙人對戰・角色選擇・必殺技・錦標賽</p><div class="panel"><label>模式 <select id="mode"><option value="ai">單人 VS 電腦</option><option value="pvp">雙人對戰</option><option value="cup">錦標賽（3 關）</option></select></label><label>玩家 1 <select id="char1"><option value="speed">⚡ 疾風（速度快）</option><option value="power">🔥 烈焰（殺球強）</option><option value="jump">🌪 飛燕（跳得高）</option></select></label><label>玩家 2 <select id="char2"><option value="power">🔥 烈焰</option><option value="speed">⚡ 疾風</option><option value="jump">🌪 飛燕</option></select></label><label>電腦難度 <select id="level"><option value="0">簡單</option><option value="1" selected>普通</option><option value="2">困難</option></select></label><button id="start">開始／重新開始</button><button id="pause">暫停</button></div><canvas id="game" width="1000" height="560"></canvas><p id="status">選擇模式和角色，按開始！</p><p class="help">🔵 玩家 1：<kbd>A</kbd><kbd>D</kbd> 移動、<kbd>W</kbd> 跳、<kbd>J</kbd> 揮拍、<kbd>K</kbd> 必殺技　｜　🔴 玩家 2：<kbd>←</kbd><kbd>→</kbd> 移動、<kbd>↑</kbd> 跳、<kbd>1</kbd> 揮拍、<kbd>2</kbd> 必殺技（數字鍵）<br>必殺技需集滿能量；體力會隨移動、跳躍消耗，停下可恢復。先得 7 分勝利！</p><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),status=document.querySelector('#status'),$=s=>document.querySelector(s);const F=475,N=500,NT=315;let keys={},players=[],ball,score=[0,0],playing=false,paused=false,over=false,serve=0,last=0,mode='ai',level=1,round=1,particles=[],flash=0;const chars={speed:{name:'疾風',speed:6.6,jump:12.5,power:7.8,color:'#36a7ff'},power:{name:'烈焰',speed:5.2,jump:12.2,power:10,color:'#ff8757'},jump:{name:'飛燕',speed:5.8,jump:15.6,power:8.2,color:'#b38bff'}};
function makeP(i,key){const q=chars[key];return {x:i?770:230,y:F,vy:0,face:i?-1:1,side:i,kind:key,...q,swing:0,stamina:100,energy:25,glow:0};}
function setup(){mode=$('#mode').value;level=+$ ('#level').value;round=1;begin();}
function begin(){players=[makeP(0,$('#char1').value),makeP(1,mode==='cup'?['speed','jump','power'][round-1]:$('#char2').value)];score=[0,0];playing=true;paused=false;over=false;particles=[];flash=0;reset(0);status.textContent=mode==='cup'?`錦標賽第 ${round} / 3 關`:'比賽開始！';}
function reset(side){ball={x:side?735:265,y:260,vx:side?-3.6:3.6,vy:-4,cool:0,trail:[],special:0};serve=65;}
function swing(p,special=false){if(p.swing>0||serve>0)return;if(special&&p.energy<100)return;p.swing=17;const dx=ball.x-p.x,dy=ball.y-(p.y-75);if(Math.abs(dx)>112||Math.abs(dy)>113||ball.cool>0)return;let power=p.power,dir=p.face;if(special){p.energy=0;p.glow=35;ball.special=60;power+=5;flash=9;burst(ball.x,ball.y,p.color,24);}else{p.energy=Math.min(100,p.energy+20);ball.special=0;burst(ball.x,ball.y,'#fff',7);}ball.vx=dir*(power+(special?1.2:Math.random()*.5));ball.vy= special?-10.5:-8.7;ball.cool=17;}
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:24,color});}
function move(p,dir,jump,dt){let moving=dir!==0;p.x+=dir*p.speed*(p.stamina<15?.7:1)*dt;p.x=Math.max(p.side?535:28,Math.min(p.side?970:465,p.x));if(jump&&p.y>=F&&p.stamina>=12){p.vy=-p.jump;p.stamina-=12;}p.stamina=Math.max(0,Math.min(100,p.stamina+(moving?-.065:.19)*dt));}
function cpu(p,dt){let difficulty=mode==='cup'?Math.min(2,round-1):level;let target=ball.x>N?ball.x-22:755;let speed=[2.9,4.4,5.9][difficulty];let dir=Math.abs(target-p.x)>14?Math.sign(target-p.x):0;p.x=Math.max(535,Math.min(970,p.x+dir*speed*dt));p.stamina=Math.min(100,p.stamina+.14*dt);if(ball.x>480&&ball.y<290&&Math.abs(ball.x-p.x)<120&&p.y>=F&&Math.random()<[.008,.022,.042][difficulty]*dt)p.vy=-p.jump;if(ball.x>490&&Math.abs(ball.x-p.x)<100&&Math.abs(ball.y-(p.y-75))<95&&ball.cool<=0&&p.swing<=0){swing(p,p.energy>=100&&difficulty>=1&&Math.random()<.35);}}
function point(winner){score[winner]++;burst(ball.x,F-12,winner?'#ff806f':'#5de9fc',25);if(score[winner]>=7){if(mode==='cup'&&winner===0&&round<3){round++;begin();status.textContent=`🎉 過關！進入錦標賽第 ${round} / 3 關`;return;}over=true;status.textContent=mode==='cup'&&winner===0?'🏆 恭喜！你是羽毛球冠軍！':winner===0?'🎉 玩家 1 勝利！':mode==='pvp'?'🎉 玩家 2 勝利！':'電腦獲勝，再挑戰一次！';return;}status.textContent=winner===0?'玩家 1 得分！':mode==='pvp'?'玩家 2 得分！':'電腦得分！';reset(1-winner);}
function update(dt){particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}flash=Math.max(0,flash-dt);if(!playing||paused||over)return;let a=players[0],b=players[1];move(a,(keys.a?-1:0)+(keys.d?1:0),keys.w,dt);if(mode==='pvp')move(b,(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0),keys.ArrowUp,dt);else cpu(b,dt);for(let p of players){p.vy+=.58*dt;p.y+=p.vy*dt;if(p.y>F){p.y=F;p.vy=0;}p.swing=Math.max(0,p.swing-dt);p.glow=Math.max(0,p.glow-dt);}if(serve>0){serve-=dt;return;}ball.vy+=.17*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.cool=Math.max(0,ball.cool-dt);ball.special=Math.max(0,ball.special-dt);ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>9)ball.trail.shift();if(ball.x<12||ball.x>988){ball.x=Math.max(12,Math.min(988,ball.x));ball.vx*=-.6;}if(Math.abs(ball.x-N)<11&&ball.y>NT&&ball.y<F){ball.vx*=-.35;ball.x+=Math.sign(ball.vx||1)*12;ball.vy=Math.max(ball.vy,1);ball.special=0;}if(ball.y>=F-5)point(ball.x<N?1:0);}
function stick(p){g.save();if(p.glow){g.shadowColor=p.color;g.shadowBlur=24;}g.strokeStyle=p.color;g.lineWidth=7;g.lineCap='round';g.beginPath();g.arc(p.x,p.y-108,15,0,7);g.moveTo(p.x,p.y-90);g.lineTo(p.x,p.y-44);g.moveTo(p.x,p.y-44);g.lineTo(p.x-19,p.y);g.moveTo(p.x,p.y-44);g.lineTo(p.x+19,p.y);g.moveTo(p.x,p.y-76);g.lineTo(p.x-22,p.y-49);g.moveTo(p.x,p.y-76);g.lineTo(p.x+p.face*37,p.y-(p.swing?100:73));g.stroke();g.restore();g.save();g.translate(p.x+p.face*53,p.y-(p.swing?105:82));g.rotate(p.face*.3);g.strokeStyle='#22334a';g.lineWidth=4;g.beginPath();g.ellipse(0,-12,17,27,0,0,7);g.stroke();g.strokeStyle='#fff';g.lineWidth=1;for(let i=-10;i<=10;i+=7){g.beginPath();g.moveTo(i,-36);g.lineTo(i,12);g.stroke();}for(let j=-30;j<=6;j+=8){g.beginPath();g.moveTo(-15,j);g.lineTo(15,j);g.stroke();}g.restore();}
function meter(x,y,p){g.fillStyle='#1b3147';g.fillRect(x,y,170,12);g.fillStyle='#55e4a0';g.fillRect(x,y,170*p.stamina/100,12);g.fillStyle='#1b3147';g.fillRect(x,y+17,170,12);g.fillStyle=p.energy>=100?'#ffe261':'#60b8ff';g.fillRect(x,y+17,170*p.energy/100,12);g.strokeStyle='#fff8';g.strokeRect(x,y,170,12);g.strokeRect(x,y+17,170,12);g.font='12px Arial';g.textAlign='left';g.fillStyle='#102038';g.fillText('體力',x+175,y+11);g.fillText('必殺',x+175,y+28);}
function draw(){let bg=g.createLinearGradient(0,0,0,F);bg.addColorStop(0,'#8bd0ff');bg.addColorStop(1,'#e4f8ff');g.fillStyle=bg;g.fillRect(0,0,1000,560);g.fillStyle='#77c995';g.fillRect(0,F,1000,85);g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(20,F+2);g.lineTo(980,F+2);g.moveTo(N,F);g.lineTo(N,560);g.stroke();g.fillStyle='#536b81';g.fillRect(496,NT,8,F-NT);g.strokeStyle='#ffffffb0';g.lineWidth=1;for(let y=NT;y<F;y+=13){g.beginPath();g.moveTo(478,y);g.lineTo(522,y);g.stroke();}for(let x=480;x<=520;x+=10){g.beginPath();g.moveTo(x,NT);g.lineTo(x,F);g.stroke();}g.textAlign='center';g.fillStyle='#132a45';g.font='bold 44px Arial';g.fillText(`${score[0]} : ${score[1]}`,500,65);g.font='bold 19px Arial';g.fillText(`P1 ${players[0]?.name||''}`,220,58);g.fillText(`${mode==='pvp'?'P2':'CPU'} ${players[1]?.name||''}`,780,58);if(mode==='cup'){g.font='bold 18px Arial';g.fillText(`🏆 第 ${round} / 3 關`,500,100);}players.forEach(stick);if(players.length===2){meter(28,93,players[0]);meter(750,93,players[1]);}if(ball){for(let i=0;i<ball.trail.length;i++){let q=ball.trail[i];g.fillStyle=ball.special?`rgba(255,95,32,${i/15})`:`rgba(255,255,255,${i/16})`;g.beginPath();g.arc(q.x,q.y,3+i*.5,0,7);g.fill();}g.save();g.translate(ball.x,ball.y);g.rotate(Math.atan2(ball.vy,ball.vx)+Math.PI/2);g.fillStyle=ball.special?'#ff9539':'white';g.beginPath();g.moveTo(-13,-19);g.lineTo(13,-19);g.lineTo(5,4);g.lineTo(-5,4);g.closePath();g.fill();g.strokeStyle='#9aa8b6';g.lineWidth=1.5;for(let i=-9;i<=9;i+=6){g.beginPath();g.moveTo(i,-18);g.lineTo(0,5);g.stroke();}g.fillStyle='#e9c14c';g.beginPath();g.arc(0,8,6,0,7);g.fill();g.restore();}for(let p of particles){g.globalAlpha=Math.max(0,p.life/24);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,4,0,7);g.fill();}g.globalAlpha=1;if(flash){g.fillStyle=`rgba(255,255,255,${flash/40})`;g.fillRect(0,0,1000,560);}if(!playing||paused||over){g.fillStyle='#0c1937b9';g.fillRect(0,0,1000,560);g.fillStyle='white';g.textAlign='center';g.font='bold 42px Arial';g.fillText(over?(mode==='cup'&&score[0]>score[1]?'🏆 冠軍誕生！':score[0]>score[1]?'玩家 1 勝利！':mode==='pvp'?'玩家 2 勝利！':'電腦勝利！'):paused?'已暫停':'火柴人羽毛球 V2',500,245);g.font='23px Arial';g.fillText(over?'按「開始」再挑戰一次':'按「開始」進入比賽',500,295);}}
function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;update(dt);draw();requestAnimationFrame(loop);}document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();let k=e.key.length===1?e.key.toLowerCase():e.key;if(!keys[k]&&playing&&!paused&&!over){if(k==='j')swing(players[0]);if(k==='k')swing(players[0],true);if(mode==='pvp'&&k==='1')swing(players[1]);if(mode==='pvp'&&k==='2')swing(players[1],true);}keys[k]=true;});document.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});window.addEventListener('blur',()=>{keys={};});$('#start').onclick=setup;$('#pause').onclick=()=>{if(playing&&!over){paused=!paused;$('#pause').textContent=paused?'繼續':'暫停';}};players=[makeP(0,'speed'),makeP(1,'power')];ball={x:500,y:190,vx:0,vy:0,trail:[],special:0};requestAnimationFrame(loop);
</script></body></html>

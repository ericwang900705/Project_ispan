<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星露森林：暗影試煉｜幽影森林</title><style>*{box-sizing:border-box}body{margin:0;background:#101725;color:#f6f0db;font-family:'Microsoft JhengHei',sans-serif}main{max-width:1190px;margin:auto;padding:12px}h1{font-size:25px;margin:6px 0;color:#ffe0a0}p{margin:6px 0 12px;color:#bfcbe0}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border:3px solid #987f5a;border-radius:10px;background:#14223b}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:12px 0}button{background:#cba45f;color:#1c2433;border:0;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer}#status{text-align:center;color:#f1cf95;min-height:24px}small{display:block;text-align:center;color:#91a2b7}</style></head><body><main><h1>⚔️ 星露森林：暗影試煉</h1><p>探索幽影森林、跳躍平台、施放劍氣，挑戰三階段魂系首領。強化首領六種招式的獨立蓄力動作、危險範圍、攻擊衝擊波與破防動畫，保留連擊及精準閃避。</p><canvas id="game" width="1152" height="648"></canvas><nav><span>A / D 移動｜Space 跳躍｜J 三段連擊｜K 重擊｜Shift 翻滾｜Q 武器技能｜I 裝備資訊｜G 格擋｜H 治療｜F 處決｜T 裝備戰利品｜E 篝火互動</span><button id="restart">重新挑戰</button><button id="pause">暫停</button></nav><div id="status"></div><small>本遊戲為原創美術與玩法，無需安裝套件或網路連線。</small></main><script>

function execute(){if(mode!=='playing'||boss.state!=='stunned'||!boss.executionReady||Math.abs(hero.x-boss.x)>190)return;boss.executionReady=false;hero.st=Math.min(hero.maxst,hero.st+25);hitBoss(185);spawn(boss.x+65,boss.y+60,'#ffe7ac',42);say('處決成功！造成大量傷害！')}
function attack(heavy){
 if(mode==='explore'){hero.heavy=heavy;exploreAttack(heavy);return}
 if(mode!=='playing'||hero.roll||hero.heal||hero.hitstun)return;
 if(!heavy&&(hero.atk>0||hero.lock>0)){

 }

}

function bossWeaponSkill(){if(mode!=='playing'||bossSkillCD>0||hero.st<34||hero.roll||hero.heal)return;hero.st-=34;bossSkillCD=105;const x=hero.x+hero.dir*45;skillShots.push({x,y:hero.y+36,dir:hero.dir,life:48,boss:true,power:hero.weapon==='shadow'?90:54});spawn(hero.x+25,hero.y+35,hero.weapon==='shadow'?'#d2a1ff':'#a8f6ff',25);say(hero.weapon==='shadow'?'暗影裂空斬！':'星露劍氣！')}

let chargeFrames=0,chargeReady=false,bossChain=0;
function releaseCharge(){
 if(mode!=='playing'||chargeFrames<1){chargeFrames=0;return}

function bossLogic(){if(boss.dead)return;boss.timer--;if(boss.hp<=boss.maxhp*.25&&boss.phase===2){boss.phase=3;boss.state='transform';boss.timer=85;boss.stagger=0;spawn(boss.x+60,boss.y+60,'#ff657e',55);say('最終階段：暗影守衛釋放深淵之力！')}if(boss.hp<=boss.maxhp*.5&&boss.phase===1){boss.phase=2;boss.state='transform';boss.timer=110;boss.stagger=0;spawn(boss.x+60,boss.y+60,'#d277f4',45);say('第二階段：暗影守衛進入狂怒狀態！')}if(boss.state==='transform'){if(boss.timer<=0){boss.state='idle';boss.timer=30}return}if(boss.state==='stunned'){if(frame%9===0)spawn(boss.x+65,boss.y+10,'#ffe5a0',3);if(boss.timer<=0){boss.executionReady=false;}if(boss.timer<=0){boss.state='idle';boss.timer=45}return}if(boss.state==='idle'){let dx=hero.x-boss.x;if(Math.abs(dx)>170){boss.x=clamp(boss.x+Math.sign(dx)*(boss.phase===3?3.6:boss.phase===2?2.7:1.7),400,1000)}if(boss.timer<=0)bossChoose();return}if(boss.state==='telegraph'){if(boss.timer%12===0)spawn(boss.x+65+boss.dir*50,boss.y+80,boss.attack==='slam'?'#ffcb77':'#ff739f',3);if(boss.timer<=0){boss.state='strike';spawn(boss.x+65,boss.y+90,boss.attack==='slam'?'#ffdf9d':'#f5a3ff',24);shake=Math.max(shake,boss.attack==='slam'?10:5);boss.timer=boss.attack==='charge'?25:boss.attack==='wave'?35:boss.attack==='triple'?65:boss.attack==='double'?46:19;boss.hitDone=false;boss.combo=0;if(boss.attack==='wave')waves.push({x:boss.x+boss.w/2,y:ground-18,dir:boss.dir,life:105,speed:boss.phase===3?13:boss.phase===2?10:7});if(boss.phase===3&&boss.attack==='wave')waves.push({x:boss.x+boss.w/2,y:ground-18,dir:-boss.dir,life:105,speed:9});}return}if(boss.state==='strike'){if((boss.attack==='double'&&(boss.timer===29||boss.timer===10))||(boss.attack==='triple'&&(boss.timer===51||boss.timer===31||boss.timer===11))){boss.hitDone=false;boss.combo++;spawn(boss.x+65,ground-75,'#ff9edc',12)}if(boss.attack==='charge')boss.x=clamp(boss.x+boss.dir*(boss.phase===3?18:boss.phase===2?15:11),400,1040);if(!boss.hitDone){let dx=hero.x+hero.w/2-(boss.x+boss.w/2);let reach=boss.attack==='charge'?100:boss.attack==='slam'?200:boss.attack==='slash'?195:boss.attack==='double'||boss.attack==='triple'?210:0;if(Math.abs(dx)<reach&&(boss.attack==='slam'||boss.attack==='charge'||Math.sign(dx)===boss.dir)&&Math.abs(hero.y+hero.h-ground)<70&&boss.attack!=='wave'&&((boss.attack!=='double'&&boss.attack!=='triple')||boss.timer===29||boss.timer===10||boss.timer===51||boss.timer===31||boss.timer===11)){hurtHero(boss.attack==='slam'?36:boss.attack==='charge'?28:boss.attack==='double'?21:23);boss.hitDone=true}}if(boss.timer<=0){boss.state='recover';boss.timer=boss.phase===3?26:boss.phase===2?31:53}return}if(boss.state==='recover'&&boss.timer<=0){if(boss.phase>=2&&bossChain<1&&Math.random()<(boss.phase===3?.75:.45)){bossChain++;bossChoose();combatNotice('⚠ 首領追擊連段！');return}bossChain=0;boss.state='idle';boss.timer=boss.phase===3?12:boss.phase===2?20:38}}

function exploreUpdate(){
  shake=Math.max(0,shake-1);hero.inv=Math.max(0,hero.inv-1);hero.hitstun=Math.max(0,hero.hitstun-1);stageAtt=Math.max(0,stageAtt-1);stageHit=Math.max(0,stageHit-1);
  const d=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
  if(d)hero.dir=d;
  stageX=clamp(stageX+d*5,18,2110);
  if((keys.has('Space')||keys.has('KeyW')||keys.has('ArrowUp'))&&hero.grounded){hero.vy=-14;hero.grounded=false}
  let oldFeet=hero.y+hero.h;hero.vy=Math.min(hero.vy+.68,15);hero.y+=hero.vy;hero.grounded=false;
  for(const pf of platforms){if(hero.vy>=0&&oldFeet<=pf.y+9&&hero.y+hero.h>=pf.y&&stageX+hero.w/2>pf.x&&stageX-hero.w/2<pf.x+pf.w){hero.y=pf.y-hero.h;hero.vy=0;hero.grounded=true;break}}
  if(hero.y+hero.h>=ground){hero.y=ground-hero.h;hero.vy=0;hero.grounded=true}
  for(const m of stageMobs){if(!m.alive)continue;
    const distance=stageX-m.x;m.wind=Math.max(0,m.wind-1);if(Math.abs(distance)<250){m.dir=Math.sign(distance)||m.dir;if(Math.abs(distance)>65)m.x+=m.dir*1.55;else if(m.wind===0)m.wind=52;}else{m.x+=m.dir*.55;if(Math.abs(m.x-m.home)>85)m.dir*=-1;}
    if(Math.abs(stageX-m.x)<62&&m.wind>0&&m.wind<22&&stageHit===0&&hero.inv===0&&Math.abs(hero.y+hero.h-ground)<75){hero.hp=Math.max(0,hero.hp-9);hero.inv=55;stageHit=65;spawn(576,ground-75,'#ff8c9e',12);if(hero.hp===0){mode='dead';say('探索途中戰敗，按 R 從篝火重新開始。')}}
  }
  if(stageX>2000&&stageKills===stageMobs.length)enterBoss();
  else if(stageX>1990&&stageKills<stageMobs.length&&frame%100===0)say('傳送門被封印：先擊敗所有森林守衛！');
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.24;p.life--}particles=particles.filter(p=>p.life>0);for(const t of damageTexts){t.y-=.85;t.life--}damageTexts=damageTexts.filter(t=>t.life>0);stageCam=clamp(stageX-420,0,1050);skillCD=Math.max(0,skillCD-1);for(const shot of skillShots){shot.x+=shot.dir*13;shot.life--;for(const m of stageMobs){if(m.alive&&Math.abs(m.x-shot.x)<48){m.hp-=2;shot.life=0;spawn(m.x-stageCam,ground-70,'#a4f4ff',18);if(m.hp<=0){m.alive=false;stageKills++;hero.hp=Math.min(hero.maxhp,hero.hp+8);say('劍氣擊敗幽影菇！')}}}}skillShots=skillShots.filter(q=>q.life>0);
  hero.x=stageX-stageCam;
}
function exploreAttack(heavy){if(stageAtt||hero.st<(heavy?24:12))return;hero.st-=heavy?24:12;stageAtt=heavy?32:19;
  let hits=0;for(const m of stageMobs){if(!m.alive)continue;const dx=m.x-stageX;
    if(Math.abs(dx)<(heavy?155:105)&&Math.sign(dx)===hero.dir&&Math.abs(hero.y+hero.h-ground)<120){m.hp-=heavy?2:1;hits++;spawn(m.x-stageCam,ground-70,'#ffdda2',12);if(m.hp<=0){m.alive=false;stageKills++;hero.hp=Math.min(hero.maxhp,hero.hp+8);say(`擊敗森林守衛 ${stageKills}/4！生命恢復少許。`)}}}
  if(!hits)say('攻擊落空！靠近怪物再出手。');
}
function drawExplore(){
  let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#142641');grad.addColorStop(1,'#4c6d71');rect(0,0,W,H,grad);
  circ(970-stageCam*.13,100,60,'#d5eddb');
  for(let i=0;i<28;i++){let x=i*100-stageCam*.35;rect(x,280+(i%3)*35,18,240,'#253c4e');circ(x+10,270+(i%3)*35,65,'#305364')}
  for(let i=0;i<24;i++){let x=i*104-stageCam;rect(x,390+(i%4)*13,20,135,'#263b3e');circ(x+10,384+(i%4)*13,55,'#376a5b')}
  for(const pf of platforms){let x=pf.x-stageCam;rect(x,pf.y,pf.w,17,'#75958c');rect(x+8,pf.y+17,pf.w-16,11,'#4b6966');for(let t=0;t<pf.w;t+=38)circ(x+t+14,pf.y,8,'#a1c2a1')}
  rect(0,ground,W,H-ground,'#33443e');rect(0,ground,W,13,'#819b78');
  for(let i=0;i<45;i++){let x=i*58-stageCam;rect(x,ground+27+(i%3)*16,30,5,'#506c5e')}
  for(const m of stageMobs){if(!m.alive)continue;let x=m.x-stageCam;if(x<-100||x>W+100)continue;
    circ(x,ground-40,38,'#9467a0');circ(x-15,ground-49,7,'#ffe8a2');circ(x+15,ground-49,7,'#ffe8a2');
    rect(x-28,ground-91,56,7,'#4c354d');rect(x-28,ground-91,56*Math.max(0,m.hp)/m.max,7,'#ff999e');

function render(){ctx.save();if(mode==='explore'){drawExplore();for(const p of particles)circ(p.x,p.y,Math.max(1,p.life/7),p.color);drawDamageTexts();ctx.restore();drawUI();return}if(shake)ctx.translate(rand(-shake/2,shake/2),rand(-shake/2,shake/2));drawBackground();if(boss.phase>=2&&!boss.dead){ctx.save();ctx.globalAlpha=boss.phase===3?.16:.08;for(let i=0;i<40;i++){let xx=(i*113+frame*(boss.phase===3?6:3))%W;let yy=(i*79+frame*2)%ground;ctx.strokeStyle=i%2?'#ef78b7':'#b9a1ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx-14,yy+27);ctx.stroke()}ctx.restore()}telegraph();for(const w of waves){circ(w.x,ground-22,23,'#b474e9');circ(w.x,ground-22,13,'#eed5ff')}drawBoss();drawHero();for(const shot of skillShots){if(!shot.boss)continue;ctx.save();ctx.globalAlpha=.8;circ(shot.x,shot.y,24,hero.weapon==='shadow'?'#b781f2':'#83edff');circ(shot.x+shot.dir*15,shot.y,13,'#fff8dc');ctx.restore()}if(parryFlash>0){ctx.save();ctx.strokeStyle=`rgba(120,240,255,${parryFlash/24})`;ctx.lineWidth=8;ctx.strokeRect(7,7,W-14,H-14);ctx.restore()}if(hitFlash>0){ctx.fillStyle=`rgba(255,82,98,${hitFlash/80})`;ctx.fillRect(0,0,W,H)}for(const p of particles)circ(p.x,p.y,Math.max(1,p.life/7),p.color);drawDamageTexts();ctx.restore();drawUI()}
function tick(){try{update();render()}catch(err){console.error(err);document.getElementById('status').textContent='遊戲錯誤：'+err.message;return}requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Enter'&&mode==='title')setup();if(e.code==='KeyR')setup();if(e.code==='KeyP'&&(mode==='playing'||mode==='explore'||mode==='paused')){if(mode==='paused')mode=window.lastMode||'playing';else{window.lastMode=mode;mode='paused'}}if(e.code==='KeyF')execute();if(e.code==='KeyI'&&['explore','playing','paused','victory'].includes(mode))equipOpen=!equipOpen;if(e.code==='KeyT'&&['explore','playing','victory'].includes(mode))equipBlade();if(e.code==='KeyQ')swordWave();if(e.code==='KeyG')guard();if(e.code==='KeyJ')attack(false);if(e.code==='KeyK')attack(true);if(e.code==='ShiftLeft'||e.code==='ShiftRight')roll();if(e.code==='KeyH')heal();if(e.code==='KeyE'&&mode==='explore'&&Math.abs(stageX-bonfire.x)<75&&(mode==='playing'||mode==='explore')){hero.hp=hero.maxhp;hero.st=hero.maxst;hero.potions=3;say('篝火休息：生命與藥水已補滿')}});window.addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='KeyU')releaseCharge()});window.addEventListener('blur',()=>keys.clear());document.getElementById('restart').onclick=setup;document.getElementById('pause').onclick=()=>{if(mode==='playing'||mode==='explore'){window.lastMode=mode;mode='paused'}else if(mode==='paused')mode=window.lastMode||'playing'};try{setup();mode='title';say('按 Enter 開始暗影試煉');tick()}catch(err){console.error(err);document.getElementById('status').textContent='啟動失敗：'+err.message;const el=document.getElementById('game');el.style.background='#263753';}
</script></body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荒野生存工藝 V3</title><style>body{margin:0;background:#111b20;color:#e8f3ed;font-family:system-ui}header{padding:12px 20px;background:#20372e;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}main{display:flex;gap:16px;padding:14px;flex-wrap:wrap;justify-content:center}canvas{background:#315c3b;border:3px solid #718d64;max-width:100%;image-rendering:pixelated}aside{width:300px;background:#22332e;padding:15px;border-radius:12px}button{background:#426d51;color:white;border:1px solid #8caf87;border-radius:7px;padding:8px;margin:3px;cursor:pointer}button:hover{background:#65966e}button:disabled{opacity:.4}#log{height:105px;overflow:auto;font-size:13px;color:#d1e3bc}small{color:#c1d4c5}h3{margin:12px 0 6px}#inventory{line-height:1.8}#hotbar{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.slot{min-width:76px;padding:8px;background:#30483b;border:2px solid #55735d;border-radius:8px;text-align:center;cursor:pointer}.slot.active{border-color:#ffd56e;background:#5d593a}#buildmenu{margin:10px 0}#buildmenu button{font-size:13px} .tip{color:#f9d889} </style></head><body><header><strong>🌲 荒野生存工藝 V3</strong><span id="stats"></span></header><main><section><canvas id="game" width="720" height="528"></canvas><p><small>WASD／方向鍵移動｜E 採集／攻擊｜空白鍵吃食物｜B 建築模式｜1–7 選建築｜X 拆除｜滑鼠點地圖放置｜夜晚小心野狼</small></p><div><button onclick="interact()">🪓 採集 / 攻擊 E</button><button onclick="eat()">🍎 吃食物 Space</button><button onclick="save()">💾 儲存</button><button onclick="resetGame()">🔄 重新開始</button></div></section><aside><h3>🧱 生存工藝 V3</h3><div id="buildmenu"></div><div id="hotbar"></div><p class="tip" id="modehint">選擇建築，再點地圖空地放置。</p><h3>🎒 背包</h3><div id="inventory"></div><h3>🔨 合成製作</h3><div id="craft"></div><h3>📜 生存紀錄</h3><div id="log"></div><p><small>目標：採礦、農耕、製作鐵劍與護甲，建造基地並生存五天。建築會消耗背包材料。</small></p></aside></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),T=24,W=30,H=22;let keys={},world=[],enemies=[],player,inv,day,tick,logs=[],built={},over=false;let structures=[],selected=0,buildingMode=true;let farmGrowth=0;
const recipes={ '🪓 石斧':{wood:3,stone:2},'🔥 營火':{wood:5,stone:4},'🛠️ 工作台':{wood:8,stone:3},'🏠 庇護所':{wood:15,stone:10,fiber:6},'🍲 熟食':{berry:3,wood:1},'⛏️ 鐵鎬':{wood:5,stone:5,iron:3},'⚔️ 鐵劍':{wood:3,iron:5},'🛡️ 護甲':{fiber:6,iron:5}};
function rnd(n){return Math.floor(Math.random()*n)}function msg(s){logs.unshift('第'+day+'天：'+s);logs=logs.slice(0,7);renderUI()}
function init(){structures=[];selected=0;buildingMode=true;world=Array.from({length:H},(_,j)=>Array.from({length:W},(_,i)=>{if(i<2||j<2||i>W-3||j>H-3)return 'water';let r=Math.random();return r<.12?'tree':r<.19?'rock':r<.27?'bush':r<.31?'fiber':r<.345?'ore':'grass'}));player={x:15,y:11,hp:100,hunger:100,energy:100};for(let j=9;j<14;j++)for(let i=13;i<18;i++)world[j][i]='grass';inv={wood:0,stone:0,berry:3,fiber:0,meat:0,iron:0,seed:2,carrot:0};day=1;tick=0;enemies=[];built={};over=false;logs=[];msg('你在荒野醒來，先收集資源吧！')}
function pass(i,j){return i>=0&&j>=0&&i<W&&j<H&&world[j][i]!=='water'&&world[j][i]!=='tree'&&world[j][i]!=='rock'&&!structures.some(b=>b.x===i&&b.y===j&&b.type!=='floor'&&b.type!=='campfire'&&b.type!=='farm')}
function move(dx,dy){if(over)return;let nx=player.x+dx,ny=player.y+dy;if(pass(nx,ny)&&!enemies.some(e=>e.x===nx&&e.y===ny)){player.x=nx;player.y=ny;player.energy=Math.max(0,player.energy-.15)}renderUI()}
function interact(){if(over)return;let dirs=[[0,0],[0,-1],[1,0],[0,1],[-1,0]];for(let [dx,dy] of dirs){let i=player.x+dx,j=player.y+dy;if(i<0||j<0||i>=W||j>=H)continue;let e=enemies.find(e=>e.x===i&&e.y===j);if(e){let damage=built['⚔️ 鐵劍']?75:built['🪓 石斧']?45:18;e.hp-=damage;msg('擊中野狼，造成 '+damage+' 傷害');if(e.hp<=0){enemies=enemies.filter(a=>a!==e);inv.meat+=2;inv.seed+=1;msg('擊退野狼，獲得生肉 ×2、種子 ×1')}return}let t=world[j][i],loot={tree:['wood',2],rock:['stone',2],bush:['berry',2],fiber:['fiber',2],ore:['iron',1]};if(loot[t]){let [k,n]=loot[t];inv[k]+=n;world[j][i]='grass';player.energy=Math.max(0,player.energy-2);msg('採集 '+({wood:'木材',stone:'石頭',berry:'莓果',fiber:'纖維',iron:'鐵礦'}[k])+' ×'+n);return}}msg('附近沒有可採集的資源')}
function eat(){if(over)return;if(inv.carrot>0){inv.carrot--;player.hunger=Math.min(100,player.hunger+30);msg('吃下胡蘿蔔')}else if(inv.meat>0&&built['🍲 熟食']){inv.meat--;player.hunger=Math.min(100,player.hunger+40);player.hp=Math.min(100,player.hp+10);msg('吃下熟食')}else if(inv.berry>0){inv.berry--;player.hunger=Math.min(100,player.hunger+22);msg('吃下莓果')}else msg('沒有可吃的食物')}
function craft(k){if(over||built[k]&&k!=='🍲 熟食')return;let r=recipes[k];if(Object.entries(r).some(([a,n])=>inv[a]<n)){msg('材料不足');return}Object.entries(r).forEach(([a,n])=>inv[a]-=n);built[k]=true;if(k==='🍲 熟食'){player.hunger=Math.min(100,player.hunger+50);player.hp=Math.min(100,player.hp+15);delete built[k]}msg('成功製作 '+k);renderUI()}
const blocks=[{type:'floor',icon:'🟫',name:'木地板',cost:{wood:2}},{type:'wall',icon:'🧱',name:'木牆',cost:{wood:4}},{type:'door',icon:'🚪',name:'木門',cost:{wood:3,fiber:1}},{type:'chest',icon:'📦',name:'儲物箱',cost:{wood:7}},{type:'campfire',icon:'🔥',name:'營火',cost:{wood:5,stone:4}},{type:'farm',icon:'🌱',name:'農田',cost:{wood:2,seed:1}},{type:'forge',icon:'⚒️',name:'熔爐',cost:{stone:8,iron:2}}];
function canAfford(cost){return Object.entries(cost).every(([k,v])=>(inv[k]||0)>=v)}
function buildAt(i,j){if(over)return;if(demolition){let n=structures.findIndex(b=>b.x===i&&b.y===j);if(n<0){msg('這裡沒有建築');return}let b=structures.splice(n,1)[0],r=blocks.find(v=>v.type===b.type);for(let [k,v] of Object.entries(r.cost))inv[k]=(inv[k]||0)+Math.floor(v/2);demolition=false;msg('拆除 '+r.name+'，回收部分材料');renderUI();return}if(!buildingMode)return;if(i<2||j<2||i>=W-2||j>=H-2||world[j][i]!=='grass'||structures.some(b=>b.x===i&&b.y===j)||(player.x===i&&player.y===j)||enemies.some(e=>e.x===i&&e.y===j)){msg('這裡不能建造，請選擇草地空格');return}let b=blocks[selected];if(!canAfford(b.cost)){msg('建造 '+b.name+' 的材料不足');return}for(let [k,v] of Object.entries(b.cost))inv[k]-=v;structures.push({x:i,y:j,type:b.type});if(b.type==='campfire')built['🔥 營火']=true;msg('建造成功：'+b.name);renderUI()}
function selectBlock(n){selected=n;buildingMode=true;renderUI()}
function demolish(){buildingMode=false;msg('拆除模式：點擊已有建築回收一半材料');demolition=true;renderUI()}
let demolition=false;
function toggleBuild(){buildingMode=!buildingMode;renderUI()}
function renderBuild(){document.querySelector('#buildmenu').innerHTML='<button onclick="demolish()">🔨 拆除建築（X）</button><button onclick="toggleBuild()">'+(buildingMode?'🏗️ 建築模式：開':'👣 建築模式：關')+'（B）</button>';document.querySelector('#hotbar').innerHTML=blocks.map((b,i)=>'<div class="slot '+(selected===i?'active':'')+'" onclick="selectBlock('+i+')">'+(i+1)+' · '+b.icon+'<br>'+b.name+'<br><small>'+Object.entries(b.cost).map(([k,v])=>({wood:'木',stone:'石',fiber:'纖維',iron:'鐵礦'}[k]+v)).join(' / ')+'</small></div>').join('');document.querySelector('#modehint').textContent=buildingMode?'目前選擇：'+blocks[selected].name+'，點地圖空地建造。':'建築模式已關閉，按 B 開啟。'}
c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)*c.width/r.width/T),j=Math.floor((e.clientY-r.top)*c.height/r.height/T);buildAt(i,j)});
function renderUI(){renderBuild();document.querySelector('#stats').textContent=`☀️ 第 ${day} 天｜❤️ ${Math.ceil(player.hp)}｜🍗 ${Math.ceil(player.hunger)}｜⚡ ${Math.ceil(player.energy)} ${tick%900>530?'🌙 夜晚':'☀️ 白天'}`;document.querySelector('#inventory').innerHTML=Object.entries(inv).map(([k,v])=>`${{wood:'🪵 木材',stone:'🪨 石頭',berry:'🫐 莓果',fiber:'🌾 纖維',meat:'🥩 生肉',iron:'⛓️ 鐵礦',seed:'🌰 種子',carrot:'🥕 胡蘿蔔'}[k]}：${v}`).join('<br>');document.querySelector('#craft').innerHTML=Object.entries(recipes).map(([k,r])=>`<button ${built[k]?'disabled':''} onclick="craft('${k}')">${k}${built[k]?' ✓':''}<br><small>${Object.entries(r).map(([a,n])=>(({wood:'木',stone:'石',fiber:'纖維',berry:'莓',meat:'肉',iron:'鐵',seed:'種'}[a]||a)+n)).join(' / ')}</small></button>`).join('');document.querySelector('#log').innerHTML=logs.join('<br>')}
function draw(){x.clearRect(0,0,720,528);let night=tick%900>530;x.fillStyle='#305b3c';x.fillRect(0,0,720,528);let icons={water:'🌊',tree:'🌲',rock:'🪨',bush:'🫐',fiber:'🌾',ore:'⛏️'};for(let j=0;j<H;j++)for(let i=0;i<W;i++){x.fillStyle=(i+j)%2?'#46764a':'#4d8051';if(world[j][i]==='water')x.fillStyle='#2b6482';x.fillRect(i*T,j*T,T,T);if(icons[world[j][i]]){x.font='20px serif';x.fillText(icons[world[j][i]],i*T+1,j*T+20)}}for(let b of structures){let z=blocks.find(v=>v.type===b.type);x.font='21px serif';x.fillText(z.icon,b.x*T,b.y*T+21)}for(let e of enemies){x.font='22px serif';x.fillText('🐺',e.x*T,e.y*T+21)}x.font='23px serif';x.fillText('🧑',player.x*T,player.y*T+22);if(night){x.fillStyle='rgba(8,17,36,.43)';x.fillRect(0,0,720,528);let g=x.createRadialGradient(player.x*T+12,player.y*T+12,20,player.x*T+12,player.y*T+12,built['🔥 營火']?190:95);g.addColorStop(0,'rgba(255,223,128,.15)');g.addColorStop(1,'rgba(255,223,128,0)');x.fillStyle=g;x.fillRect(0,0,720,528)}if(over){x.fillStyle='#081c1bdc';x.fillRect(0,0,720,528);x.textAlign='center';x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText(player.hp<=0?'生存失敗':'🎉 生存成功！',360,245);x.font='20px system-ui';x.fillText('點擊「重新開始」再挑戰',360,290);x.textAlign='left'}requestAnimationFrame(draw)}
function update(){if(over)return;tick++;if(tick%65===0){player.hunger=Math.max(0,player.hunger-(built['🏠 庇護所']?1:2));player.energy=Math.min(100,player.energy+2);if(player.hunger===0)player.hp-=4;if(tick%900>530&&!built['🔥 營火'])player.hp-=1;if(enemies.some(e=>Math.abs(e.x-player.x)+Math.abs(e.y-player.y)<=1))player.hp-=built['🛡️ 護甲']?1:built['🏠 庇護所']?2:7;if(player.hp<=0){over=true;msg('生命耗盡，挑戰失敗')}}if(tick%900===530){msg('夜幕降臨！野狼開始出沒');for(let n=0;n<2;n++){let i=2+rnd(W-4),j=2+rnd(H-4);if(pass(i,j))enemies.push({x:i,y:j,hp:60})}}if(tick%900===0){day++;enemies=[];for(let n=0;n<45;n++){let i=2+rnd(W-4),j=2+rnd(H-4);if(world[j][i]==='grass'&&Math.random()<.6)world[j][i]=['tree','rock','bush','fiber','ore'][rnd(5)]}msg('太陽升起，資源重新生長');structures.filter(b=>b.type==='farm').forEach(b=>{inv.carrot+=2;inv.seed+=1});msg('農田收成：每塊農田獲得胡蘿蔔 ×2');if(day>=6){over=true;msg('成功撐過五天！')}}if(tick%95===0){enemies.forEach(e=>{let dx=Math.sign(player.x-e.x),dy=Math.sign(player.y-e.y),opts=Math.random()<.5?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];for(let [a,b] of opts)if(pass(e.x+a,e.y+b)&&!(e.x+a===player.x&&e.y+b===player.y)){e.x+=a;e.y+=b;break}})}if(tick%40===0)renderUI()}
let lastMove=0;document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='b')toggleBuild();if(e.key.toLowerCase()==='x')demolish();if(/^[1-7]$/.test(e.key))selectBlock(Number(e.key)-1);if(e.key===' ')eat()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);setInterval(()=>{let now=Date.now();if(now-lastMove<110)return;let d=keys.w||keys.arrowup?[0,-1]:keys.s||keys.arrowdown?[0,1]:keys.a||keys.arrowleft?[-1,0]:keys.d||keys.arrowright?[1,0]:null;if(d){move(...d);lastMove=now}},30);function save(){localStorage.setItem('survival-craft-v3',JSON.stringify({world,enemies,player,inv,day,tick,built,over,structures,selected,buildingMode}));msg('進度已儲存')}function resetGame(){localStorage.removeItem('survival-craft-v3');init()}init();try{let s=JSON.parse(localStorage.getItem('survival-craft-v3'));if(s){Object.assign(window,{});({world,enemies,player,inv,day,tick,built,over}=s);structures=s.structures||[];inv={iron:0,seed:0,carrot:0,...inv};selected=s.selected||0;buildingMode=s.buildingMode??true;msg('已載入存檔')}}catch{}setInterval(update,70);draw();</script></body></html>
